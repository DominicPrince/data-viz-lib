    const palette = effectiveTheme.palette || PRESETS.default.palette;

    if (!data.length) {
      return { content: `<text x="${W/2}" y="150" text-anchor="middle" font-size="13" font-family="${font}" fill="${textColor}">Add data points to see the chart</text>`, h: 300 };
    }

    const total = data.reduce((s, d) => s + Math.max(+d.value || 0, 0), 0);
    if (total === 0) {
      return { content: `<text x="${W/2}" y="150" text-anchor="middle" font-size="13" font-family="${font}" fill="${textColor}">All values are zero</text>`, h: 300 };
    }

    const showValues = options?.showValues !== false;
    const showLegend = options?.showLegend !== false;

    // Pre-measure legend label widths for centered row layout
    const _can = document.createElement('canvas');
    const _ctx = _can.getContext('2d');
    _ctx.font = `11px ${font}`;
    const legendItemGap     = 16;
    const legendSquareW     = 14;
    const legendItemWidths  = data.map(d => legendSquareW + Math.ceil(_ctx.measureText(d.label).width));
    const legendItemsPerRow = Math.min(data.length, 4);
    const legendRows = showLegend ? Math.ceil(data.length / legendItemsPerRow) : 0;
    const legendH    = showLegend ? legendRows * 20 + 10 : 0;

    // Fixed height for the pie circle area; legend grows below it
    const pieAreaH = 280;
    const H = pieAreaH + legendH + 16; // 16px bottom padding

    // Leave space around pie for outside leader-line labels
    const labelPad = 44;
    const chartAreaH = pieAreaH;
    const cx = W / 2;
    const cy = chartAreaH / 2;
    const R  = Math.max(Math.min(W / 2 - labelPad, chartAreaH / 2 - labelPad), 30);
    const innerR = variant === 'donut' ? R * 0.5 : 0;

    const fid = glow ? 'pie' + Math.random().toString(36).slice(2, 6) : '';
    const filterDef = glow
      ? `<filter id="${fid}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceGraphic" stdDeviation="${glowSD}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`
      : '';
    const glowAttr = glow ? ` filter="url(#${fid})"` : '';

    const interactive = options?.interactive || false;
    let valueLabels = '', legendItems = '';
    let startAngle = -Math.PI / 2;
    let slices = '';
    const outsideLabels = []; // collected for deconfliction

    data.forEach((d, i) => {
      const val        = Math.max(+d.value || 0, 0);
      const sliceAngle = (val / total) * 2 * Math.PI;
      const endAngle   = startAngle + sliceAngle;
      const fill       = options?.barColors?.[i] || palette[i % palette.length];
      const isSelected = options?.selectedBar === i;
      const largeArc   = sliceAngle > Math.PI ? 1 : 0;
      const midAngle   = startAngle + sliceAngle / 2;

      const x1 = cx + R * Math.cos(startAngle), y1 = cy + R * Math.sin(startAngle);
      const x2 = cx + R * Math.cos(endAngle),   y2 = cy + R * Math.sin(endAngle);

      // SVG arcs with coincident start/end points are silently dropped — a full-circle
      // slice (100%) must be drawn as a <circle> instead.
      const isFullCircle = sliceAngle >= 2 * Math.PI - 0.0001;
      let sliceEl;
      if (isFullCircle) {
        if (variant === 'donut') {
          // Two concentric circles: filled outer, bg-coloured inner hole
          sliceEl = `<circle data-bar-idx="${i}" cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="${R}" fill="${fill}" fill-opacity="${isSelected ? 1 : 0.88}"/>` +
                    `<circle cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="${innerR}" fill="${effectiveTheme.bg}"/>`;
        } else {
          sliceEl = `<circle data-bar-idx="${i}" cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="${R}" fill="${fill}" fill-opacity="${isSelected ? 1 : 0.88}"/>`;
        }
      } else {
        let d_attr;
        if (variant === 'donut') {
          const ix1 = cx + innerR * Math.cos(startAngle), iy1 = cy + innerR * Math.sin(startAngle);
          const ix2 = cx + innerR * Math.cos(endAngle),   iy2 = cy + innerR * Math.sin(endAngle);
          d_attr = `M ${x1.toFixed(2)},${y1.toFixed(2)} A ${R},${R} 0 ${largeArc},1 ${x2.toFixed(2)},${y2.toFixed(2)} L ${ix2.toFixed(2)},${iy2.toFixed(2)} A ${innerR},${innerR} 0 ${largeArc},0 ${ix1.toFixed(2)},${iy1.toFixed(2)} Z`;
        } else {
          d_attr = `M ${cx},${cy} L ${x1.toFixed(2)},${y1.toFixed(2)} A ${R},${R} 0 ${largeArc},1 ${x2.toFixed(2)},${y2.toFixed(2)} Z`;
        }
        sliceEl = `<path data-bar-idx="${i}" d="${d_attr}" fill="${fill}" fill-opacity="${isSelected ? 1 : 0.88}" stroke="${effectiveTheme.bg}" stroke-width="1"/>`;
      }

      if (interactive) {
        const pct = Math.round(val / total * 100);
        const ttText = d.label ? d.label + ': ' + pct + '%' : pct + '%';
        const depth = variant === 'donut' ? (R + innerR) / 2 : R * 0.62;
        const ttCx = cx + depth * Math.cos(midAngle);
        const ttCy = cy + depth * Math.sin(midAngle);
        const tt = makeTT(ttCx, ttCy, ttText, font, textColor, effectiveTheme.bg, midAngle < 0 || midAngle > Math.PI);
        slices += `<g class="ci"><g class="ci-el">${sliceEl}</g>${tt}</g>`;
      } else {
        slices += sliceEl;
      }

      if (showValues) {
        const pct     = Math.round(val / total * 100);
        const pctStr  = pct + '%';
        const isSmall = sliceAngle / (2 * Math.PI) < 0.08;

        if (isSmall) {
          // Collect for deconfliction below
          const elbowR = R + 26;
          const dir    = Math.cos(midAngle) >= 0 ? 1 : -1;
          // Clamp elbowX so near-top/bottom slices (cos≈0) still get a
          // visible horizontal shelf rather than collapsing to the pie centre.
          const rawElbowX = cx + elbowR * Math.cos(midAngle);
          const elbowX    = dir > 0
            ? Math.max(rawElbowX, cx + 18)
            : Math.min(rawElbowX, cx - 18);
          outsideLabels.push({
            midAngle,
            elbowX,
            naturalY: cy + elbowR * Math.sin(midAngle),
            adjustedY: cy + elbowR * Math.sin(midAngle),
            dir,
            pctStr,
          });
        } else {
          // Centred inside the slice
          const depth = variant === 'donut' ? (R + innerR) / 2 : R * 0.62;
          const lx = cx + depth * Math.cos(midAngle);
          const ly = cy + depth * Math.sin(midAngle);
          const labelColor = isColorDark(fill) ? '#fff' : '#1C1A17';
          valueLabels += `<text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" font-size="11" font-weight="600" font-family="${font}" fill="${labelColor}" text-anchor="middle">${escSVG(pctStr)}</text>`;
        }
      }

      startAngle = endAngle;
    });

    // Deconflict outside labels — push overlapping labels apart per side, 13px minimum gap.
    // No clamping: labels are allowed to overflow. We'll measure the overflow after and
    // add it as top/bottom padding to the SVG so nothing clips and the pie isn't intruded.
    const minGap = 13;
    [1, -1].forEach(side => {
      const group = outsideLabels.filter(l => l.dir === side).sort((a, b) => a.naturalY - b.naturalY);
      if (group.length < 2) return;
      let changed = true;
      for (let pass = 0; pass < 30 && changed; pass++) {
        changed = false;
        for (let j = 1; j < group.length; j++) {
          if (group[j].adjustedY - group[j - 1].adjustedY < minGap) {
            const mid = (group[j].adjustedY + group[j - 1].adjustedY) / 2;
            group[j - 1].adjustedY = mid - minGap / 2;
            group[j].adjustedY     = mid + minGap / 2;
            changed = true;
          }
        }
        for (let j = group.length - 2; j >= 0; j--) {
          if (group[j + 1].adjustedY - group[j].adjustedY < minGap) {
            const mid = (group[j + 1].adjustedY + group[j].adjustedY) / 2;
            group[j].adjustedY     = mid - minGap / 2;
            group[j + 1].adjustedY = mid + minGap / 2;
            changed = true;
          }
        }
      }
    });

    // Measure overflow: if any label sits above y=8 or below pieAreaH-8, grow the SVG
    // rather than pushing labels into the pie.
    const allAdjY = outsideLabels.map(l => l.adjustedY);
    const topPad = allAdjY.length ? Math.max(0, 8 - Math.min(...allAdjY)) : 0;
    const botPad = allAdjY.length ? Math.max(0, Math.max(...allAdjY) - (pieAreaH - 8)) : 0;
    // Recompute total H to fit the extra padding
    const H_final = pieAreaH + topPad + botPad + legendH + 16;

    // Render outside labels (positions are relative to the pie; topPad is applied via SVG translate)
    outsideLabels.forEach(({ midAngle, elbowX, naturalY, adjustedY, dir, pctStr }) => {
      const rimX      = cx + (R + 10) * Math.cos(midAngle);
      const rimY      = cy + (R + 10) * Math.sin(midAngle);
      const shelfEndX = elbowX + dir * 10;
      const anchor    = dir > 0 ? 'start' : 'end';
      const stroke    = `stroke="${textColor}" stroke-width="1" stroke-opacity="0.4" stroke-linecap="round"`;
      valueLabels +=
        // 1. Horizontal shelf out from the elbow to the label
        `<line x1="${elbowX.toFixed(1)}" y1="${adjustedY.toFixed(1)}" x2="${shelfEndX.toFixed(1)}" y2="${adjustedY.toFixed(1)}" ${stroke}/>` +
        // 2. Diagonal from the elbow back to the slice rim
        `<line x1="${elbowX.toFixed(1)}" y1="${adjustedY.toFixed(1)}" x2="${rimX.toFixed(1)}" y2="${rimY.toFixed(1)}" ${stroke}/>` +
        `<text x="${(shelfEndX + dir * 3).toFixed(1)}" y="${(adjustedY + 4).toFixed(1)}" font-size="10" font-weight="600" font-family="${font}" fill="${textColor}" fill-opacity="0.65" text-anchor="${anchor}">${escSVG(pctStr)}</text>`;
    });

    // Outer ring: a bg-coloured band around the circumference that covers the
    // harsh junction points where radial separator lines meet the outer arc.
    const outerRing = `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${R}" fill="none" stroke="${effectiveTheme.bg}" stroke-width="16"/>`;

    // Legend — sits below the pie area (after topPad shift)
    if (showLegend) {
      for (let row = 0; row < legendRows; row++) {
        const start = row * legendItemsPerRow;
        const end   = Math.min(start + legendItemsPerRow, data.length);
        const rowW  = legendItemWidths.slice(start, end).reduce((s, w) => s + w, 0) + (end - start - 1) * legendItemGap;
        let lx = (W - rowW) / 2;
        const ly = pieAreaH + topPad + 8 + row * 20;
        for (let i = start; i < end; i++) {
          const fill = options?.barColors?.[i] || palette[i % palette.length];
          legendItems += `<rect x="${lx.toFixed(1)}" y="${(ly + 2).toFixed(1)}" width="10" height="10" rx="2" fill="${fill}"/>`;
          legendItems += `<text x="${(lx + 14).toFixed(1)}" y="${(ly + 11).toFixed(1)}" font-size="11" font-family="${font}" fill="${textColor}">${escSVG(data[i].label)}</text>`;
          lx += legendItemWidths[i] + legendItemGap;
        }
      }
    }

    // Wrap pie content in a translate so topPad pushes the pie down, giving labels room above
    const pieGroup = `<g transform="translate(0,${topPad})">${(filterDef ? `<defs>${filterDef}</defs>` : '')}<g${glowAttr}>${slices}</g>${outerRing}${valueLabels}</g>`;
    return { content: pieGroup + legendItems, h: H_final };
  }

  /* Scatter plot — data rows: { x, y, label? } */
  function renderScatterPlotInner(theme, data, chartStyle, options) {
    const W = 560, H = 300;
    const effectiveTheme = options?.bgColor ? { ...theme, bg: options.bgColor } : theme;
    const tok = chartTokens(effectiveTheme, chartStyle);
    const { gridColor, baseColor, font, c0, gridDash, glow, glowSD, axisLabels } = tok;
    const textColor = options?.labelColor || tok.textColor;
    const dotR = 5;

    if (!data.length) {
      return `<text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="13" font-family="${font}" fill="${textColor}">Add data points to see the chart</text>`;
    }

    const xs = data.map(d => +d.x || 0);
    const ys = data.map(d => +d.y || 0);

    const pad = { top: 12 + dotR, right: 12 + dotR, bottom: 44, left: 54 };
    const xLabelLines = (options?.xLabel && axisLabels) ? wrapSVGText(options.xLabel, W - 100, 11, false, font) : [];
    if (xLabelLines.length) pad.bottom += 14 + xLabelLines.length * 14;
    const yLabelLines = (options?.yLabel && axisLabels) ? wrapSVGText(options.yLabel, 220, 11, false, font) : [];
    if (yLabelLines.length) pad.left = Math.max(pad.left, 54 + (yLabelLines.length - 1) * 14);

    const hasXMin = options?.xMin !== '' && options?.xMin !== undefined && !isNaN(+options.xMin);
    const hasXMax = options?.xMax !== '' && options?.xMax !== undefined && !isNaN(+options.xMax);
    const hasYMin = options?.yMin !== '' && options?.yMin !== undefined && !isNaN(+options.yMin);
    const hasYMax = options?.yMax !== '' && options?.yMax !== undefined && !isNaN(+options.yMax);

    const xDataMin = Math.min(...xs), xDataMax = Math.max(...xs);
    const yDataMin = Math.min(...ys), yDataMax = Math.max(...ys);
    const xP = (xDataMax - xDataMin || 1) * 0.12;
    const yP = (yDataMax - yDataMin || 1) * 0.15;

    const xMinS = hasXMin ? +options.xMin : xDataMin - xP;
    const xMaxS = hasXMax ? +options.xMax : xDataMax + xP;
    const yMinS = hasYMin ? +options.yMin : yDataMin - yP;
    const yMaxS = hasYMax ? +options.yMax : yDataMax + yP;

    const cW = W - pad.left - pad.right;
    const cH = H - pad.top - pad.bottom;
    const scX = x => pad.left + ((x - xMinS) / (xMaxS - xMinS)) * cW;
    const scY = y => pad.top + cH - ((y - yMinS) / (yMaxS - yMinS)) * cH;
    const dash = gridDash ? ` stroke-dasharray="${gridDash}"` : '';

    const { ticks: xTicks } = customScale(xMinS, xMaxS, 4);
    const { ticks: yTicks } = customScale(yMinS, yMaxS, 4);

    const grid =
      yTicks.map(t => {
        const y = scY(t).toFixed(1);
        const lbl = axisLabels ? `<text x="${pad.left - 8}" y="${(+y + 4).toFixed(1)}" text-anchor="end" font-size="11" font-family="${font}" fill="${textColor}">${fmtTick(t)}</text>` : '';
        return `<line x1="${pad.left}" y1="${y}" x2="${W - pad.right}" y2="${y}" stroke="${t === 0 ? baseColor : gridColor}" stroke-width="1"${dash}/>${lbl}`;
      }).join('') +
      xTicks.map(t => {
        const x = scX(t).toFixed(1);
        const lbl = axisLabels ? `<text x="${x}" y="${(pad.top + cH + 16).toFixed(1)}" text-anchor="middle" font-size="11" font-family="${font}" fill="${textColor}">${fmtTick(t)}</text>` : '';
        return `<line x1="${x}" y1="${pad.top}" x2="${x}" y2="${(pad.top + cH).toFixed(1)}" stroke="${t === 0 ? baseColor : gridColor}" stroke-width="1"${dash}/>${lbl}`;
      }).join('');

    const fid = glow ? 'sct' + Math.random().toString(36).slice(2, 6) : '';
    const filterDef = glow ? `<filter id="${fid}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceGraphic" stdDeviation="${glowSD}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>` : '';

    const interactive = options?.interactive || false;
    const dots = data.map((d, i) => {
      const px = scX(+d.x || 0), py = scY(+d.y || 0);
      const fill = options?.barColors?.[i] || c0;
      const isSelected = options?.selectedBar === i;
      const circle = `<circle data-bar-idx="${i}" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${dotR}" fill="${fill}" fill-opacity="0.8" stroke="${fill}" stroke-width="1.5"/>`;
      const ring   = isSelected ? `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${dotR + 4}" fill="none" stroke="${fill}" stroke-width="2" opacity="0.45"/>` : '';
      const labelAboveY = py - dotR - 5;
      const below  = labelAboveY < pad.top + 10;
      const lblY   = below ? py + dotR + 14 : labelAboveY;
      const rectY  = below ? py + dotR + 3  : py - dotR - 16;
      const lbl    = d.label
        ? `<text data-editable="scatter-label-${i}" x="${px.toFixed(1)}" y="${lblY.toFixed(1)}" text-anchor="middle" font-size="10" font-family="${font}" fill="${textColor}">${escSVG(d.label)}</text>`
        : `<rect data-editable="scatter-label-${i}" x="${(px - 22).toFixed(1)}" y="${rectY.toFixed(1)}" width="44" height="13" fill="transparent" style="cursor:text"/>`;
      if (interactive) {
        const ttText = (d.label ? d.label + ': ' : '') + '(' + fmtTick(+d.x) + ', ' + fmtTick(+d.y) + ')';
        const tt = makeTT(px, py, ttText, font, textColor, effectiveTheme.bg, py > 30);
        return `<g class="ci"><g class="ci-el">${circle}${ring}</g>${lbl}${tt}</g>`;
      }
      return circle + ring + lbl;
    }).join('');

    const glowAttr = glow ? ` filter="url(#${fid})"` : '';
    let axisLabelsSVG = '';
    if (xLabelLines.length) {
      const cx = (pad.left + cW / 2).toFixed(1);
      xLabelLines.forEach((line, i) => {
        const ly = H - 14 - (xLabelLines.length - 1 - i) * 14;
        axisLabelsSVG += `<text x="${cx}" y="${ly}" text-anchor="middle" font-size="11" font-family="${font}" fill="${textColor}">${escSVG(line)}</text>`;
      });
    }
    if (yLabelLines.length) {
      const cy = pad.top + cH / 2;
      yLabelLines.forEach((line, i) => {
        const lx = 14 + i * 14;
        axisLabelsSVG += `<text text-anchor="middle" font-size="11" font-family="${font}" fill="${textColor}" transform="translate(${lx},${cy.toFixed(1)}) rotate(-90)">${escSVG(line)}</text>`;
      });
    }

    return (filterDef ? `<defs>${filterDef}</defs>` : '') + `${grid}<g${glowAttr}>${dots}</g>${axisLabelsSVG}`;
  }

  function escSVG(str) {
    return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function escAttr(str) {
    return (str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  /* ── Col-tip tooltip (fixed-position to escape stacking contexts) ── */
  let _tipEl = null;
  document.addEventListener('mouseover', e => {
    const badge = e.target.closest('.col-tip');
    if (!badge) return;
    if (_tipEl) _tipEl.remove();
    _tipEl = document.createElement('div');
    _tipEl.className = 'col-tip-popup';
    _tipEl.textContent = badge.dataset.tip || '';
    document.body.appendChild(_tipEl);
    const r = badge.getBoundingClientRect();
    _tipEl.style.left = (r.left + r.width / 2) + 'px';
    _tipEl.style.top  = (r.top - _tipEl.offsetHeight - 7) + 'px';
  });
  document.addEventListener('mouseout', e => {
    const badge = e.target.closest('.col-tip');
    if (!badge) return;
    if (_tipEl) { _tipEl.remove(); _tipEl = null; }
  });

  function hexToRgba(hex, alpha) {
    const c = hex.replace('#', '');
    return `rgba(${parseInt(c.substr(0,2),16)},${parseInt(c.substr(2,2),16)},${parseInt(c.substr(4,2),16)},${alpha})`;
  }

  /* Canvas-based text measurement for SVG word-wrap */
  const _wrapCanvas = document.createElement('canvas');
  const _wrapCtx = _wrapCanvas.getContext('2d');

  function wrapSVGText(text, maxWidth, fontSize, isBold, fontFamily) {
    if (!text) return [];
    // Use primary font name for measurement (strips quotes and fallbacks)
    const primary = fontFamily.split(',')[0].replace(/['"]/g, '').trim();
    _wrapCtx.font = `${isBold ? '700 ' : ''}${fontSize}px ${primary}`;
    // Split on hard line-breaks first, then word-wrap each paragraph
    const lines = [];
    for (const para of text.split('\n')) {
      const words = para.split(' ');
      let line = '';
      for (const word of words) {
        const test = line ? line + ' ' + word : word;
        if (_wrapCtx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = word;
        } else {
          line = test;
        }
      }
      lines.push(line); // preserve hard breaks (empty string = blank line)
    }
    if (lines.length && lines[lines.length - 1] === '') lines.pop();
    return lines;
  }

  /* Wraps chart inner content with title / subtitle / source / logo */
  function composeSVG(innerContent, state, chartH = 300) {
    const W = 560;
    const { theme, options, chartStyle } = state;
    const { title, subtitle, source, logoDataUrl } = options;
    const bg = options?.bgColor || theme.bg;
    const interactive = options?.interactive || false;
    const chartUid = interactive ? 'c' + Math.random().toString(36).slice(2, 9) : '';

    const tok = chartTokens({ ...theme, bg }, chartStyle);
    const font = tok.font;
    const maxTextW = W - 48; // 24px padding each side

    // Wrap both text fields; line heights: title=22px, subtitle=18px
    const titleLines    = wrapSVGText(title,    maxTextW, 18, true,  font);
    const subtitleLines = wrapSVGText(subtitle, maxTextW, 13, false, font);

    // topPad: 40px base for first title line + 22px per extra; 24px base for subtitle + 18px per extra
    let topPad = 0, bottomPad = 0;
    if (titleLines.length)     topPad += 40 + (titleLines.length    - 1) * 22;
    if (subtitleLines.length)  topPad += 24 + (subtitleLines.length - 1) * 18;
    const logoH = options?.logoSize || 12;
    if (source)     bottomPad = Math.max(bottomPad, 40);
    if (logoDataUrl) bottomPad = Math.max(bottomPad, logoH + 16);

    const totalH = chartH + topPad + bottomPad;
    const dark = isColorDark(bg);
    const textColor  = options?.fontColor || (dark ? 'rgba(255,255,255,0.85)' : '#1A1816');
    const mutedColor = options?.fontColor
      ? hexToRgba(options.fontColor, 0.6)
      : (dark ? 'rgba(255,255,255,0.45)' : '#767676');

    let out = `<svg${interactive ? ` id="${chartUid}"` : ''} xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 ${W} ${totalH}">`;
    if (interactive) {
      const s = '#' + chartUid;
      out += `<style>${s} .ci{cursor:pointer}${s} .ci .ci-el{transition:opacity .15s}${s} .ci:hover .ci-el{opacity:.75}${s} .ci .tt{opacity:0;transition:opacity .15s;pointer-events:none}${s} .ci:hover .tt{opacity:1}</style>`;
    }
    out += `<rect width="${W}" height="${totalH}" fill="${bg}"/>`;

    let ty = 0;
    titleLines.forEach((ln, i) => {
      out += `<text data-editable="title" x="24" y="${ty + 30 + i * 22}" font-size="18" font-weight="700" font-family="${font}" fill="${textColor}">${escSVG(ln)}</text>`;
    });
    if (titleLines.length) ty += 40 + (titleLines.length - 1) * 22;

    subtitleLines.forEach((ln, i) => {
      out += `<text data-editable="subtitle" x="24" y="${ty + 16 + i * 18}" font-size="13" font-family="${font}" fill="${mutedColor}">${escSVG(ln)}</text>`;
    });

    out += `<g transform="translate(0,${topPad})">${innerContent}</g>`;

    if (source) {
      out += `<text data-editable="source" x="24" y="${topPad + chartH + 28}" font-size="11" font-family="${font}" fill="${mutedColor}">${escSVG('Source: ' + source)}</text>`;
    }
    if (logoDataUrl) {
      const logoY = topPad + chartH + Math.floor((bottomPad - logoH) / 2);
      let logoX = 24, logoW = W - 48; // default: full span, preserveAspectRatio right-aligns for PNGs
      // SVG images ignore the outer preserveAspectRatio, so compute exact width + x from viewBox
      if (logoDataUrl.startsWith('data:image/svg')) {
        try {
          const svgText = atob(logoDataUrl.split(',')[1]);
          const vb = svgText.match(/viewBox=["']([^"']+)["']/);
          const parts = vb ? vb[1].trim().split(/\s+/) : [];
          const wAttr = svgText.match(/\bwidth=["']([\d.]+)/);
          const hAttr = svgText.match(/\bheight=["']([\d.]+)/);
          const vbW = parts.length >= 4 ? parseFloat(parts[2]) : (wAttr ? parseFloat(wAttr[1]) : 0);
          const vbH = parts.length >= 4 ? parseFloat(parts[3]) : (hAttr ? parseFloat(hAttr[1]) : 0);
          if (vbW && vbH) {
            logoW = Math.round(logoH * (vbW / vbH));
            logoX = W - 24 - logoW;
          }
        } catch(e) {}
      }
      out += `<image data-editable="logo" style="cursor:pointer" href="${logoDataUrl}" x="${logoX}" y="${logoY}" width="${logoW}" height="${logoH}" preserveAspectRatio="xMaxYMid meet"/>`;
    }

    out += '</svg>';
    return out;
  }

  /* ─────────────────────────────────────────────────────────
     Builder state
  ───────────────────────────────────────────────────────── */

  const saved = sessionStorage.getItem('builderState');
  // Also accept ?chart=bubble-chart URL param to start a fresh builder without modal flow
  const _urlChart = new URLSearchParams(window.location.search).get('chart');
  const _sessionParsed = saved ? JSON.parse(saved) : null;
  const _initChartId   = _sessionParsed?.chartId || _urlChart;
  if (!_initChartId) { window.location.href = 'index.html'; }

  // Prefer localStorage so progress survives a refresh; sessionStorage is the
  // initial payload written by the catalog page and is always overwritten first.
  const _localSaved  = localStorage.getItem('builderState_' + _initChartId);
  const loaded = _localSaved ? JSON.parse(_localSaved)
               : _sessionParsed || { chartId: _initChartId, data: [], theme: PRESETS.journeys, chartStyle: 'journeys' };

  const chartId = loaded.chartId || 'bar-chart';
  const schema  = (typeof CHART_SCHEMAS !== 'undefined' && CHART_SCHEMAS[chartId]) || null;

  const bState = {
    data:       loaded.data       || [],
    theme:      loaded.theme      || PRESETS.journeys,
    chartStyle: loaded.chartStyle || 'journeys',
    options: {
      title: '', subtitle: '', source: '', logoDataUrl: null, xLabel: '', yLabel: '',
      fontColor: '', labelColor: '', bgColor: '', logoSize: 12, barColors: [], selectedBar: -1,
      yMin: '', yMax: '', xMin: '', xMax: '', showValues: true, showLegend: true, interactive: false,
      ...(loaded.options || {}), selectedBar: -1,
    },
  };

  // Normalize legacy bar-chart data format { l, v } → { label, value }
  if (chartId === 'bar-chart' && bState.data.length && bState.data[0].l !== undefined) {
    bState.data = bState.data.map(r => ({ label: r.l ?? '', value: r.v ?? 0 }));
  }

  // Seed data — used when the builder opens with no data (e.g. direct URL access)
  const DEFAULT_DATA = {
    'bar-chart':      [{ label: 'North America', value: 142 }, { label: 'Europe', value: 118 }, { label: 'Asia Pacific', value: 203 }, { label: 'Latin America', value: 74 }, { label: 'Middle East', value: 51 }, { label: 'Africa', value: 38 }],
    'lollipop-chart': [{ label: 'North America', value: 142 }, { label: 'Europe', value: 118 }, { label: 'Asia Pacific', value: 203 }, { label: 'Latin America', value: 74 }, { label: 'Middle East', value: 51 }, { label: 'Africa', value: 38 }],
    'dot-plot':       [{ label: 'North America', value: 142 }, { label: 'Europe', value: 118 }, { label: 'Asia Pacific', value: 203 }, { label: 'Latin America', value: 74 }, { label: 'Middle East', value: 51 }, { label: 'Africa', value: 38 }],
    'pie-chart':      [{ label: 'Direct', value: 38 }, { label: 'Organic Search', value: 27 }, { label: 'Social', value: 18 }, { label: 'Referral', value: 11 }, { label: 'Other', value: 6 }],
    'donut-chart':    [{ label: 'Direct', value: 38 }, { label: 'Organic Search', value: 27 }, { label: 'Social', value: 18 }, { label: 'Referral', value: 11 }, { label: 'Other', value: 6 }],
    'line-chart':     [{ date: '2024-01', value: 84 }, { date: '2024-02', value: 91 }, { date: '2024-03', value: 78 }, { date: '2024-04', value: 105 }, { date: '2024-05', value: 117 }, { date: '2024-06', value: 112 }, { date: '2024-07', value: 130 }, { date: '2024-08', value: 124 }],
    'area-chart':     [{ date: '2024-01', value: 84 }, { date: '2024-02', value: 91 }, { date: '2024-03', value: 78 }, { date: '2024-04', value: 105 }, { date: '2024-05', value: 117 }, { date: '2024-06', value: 112 }, { date: '2024-07', value: 130 }, { date: '2024-08', value: 124 }],
    'step-chart':     [{ date: '2024-01', value: 84 }, { date: '2024-02', value: 91 }, { date: '2024-03', value: 78 }, { date: '2024-04', value: 105 }, { date: '2024-05', value: 117 }, { date: '2024-06', value: 112 }, { date: '2024-07', value: 130 }, { date: '2024-08', value: 124 }],
    'scatter-plot':   [{ x: 12, y: 34, label: 'A' }, { x: 28, y: 52, label: 'B' }, { x: 45, y: 41, label: 'C' }, { x: 56, y: 78, label: 'D' }, { x: 63, y: 55, label: 'E' }, { x: 71, y: 88, label: 'F' }, { x: 82, y: 67, label: 'G' }, { x: 91, y: 94, label: 'H' }],
    'bubble-chart':   [{ x: 25, y: 42, size: 18, label: 'Alpha' }, { x: 40, y: 60, size: 32, label: 'Beta' }, { x: 55, y: 35, size: 12, label: 'Gamma' }, { x: 68, y: 72, size: 45, label: 'Delta' }, { x: 77, y: 50, size: 22, label: 'Epsilon' }, { x: 88, y: 80, size: 60, label: 'Zeta' }],
  };

  if (!bState.data.length && DEFAULT_DATA[chartId]) {
    bState.data = DEFAULT_DATA[chartId];
  }

  // Update page title from schema
  const chartName = schema?.name || 'Chart';
  document.title = chartName + ' Builder — data-viz-lib';
  document.getElementById('builder-title').textContent = chartName + ' Builder';

  // Show X-axis range controls when schema needs them (or always for bubble/scatter)
  if (schema?.config?.axes?.xMin || schema?.config?.axes?.xMax || chartId === 'bubble-chart' || chartId === 'scatter-plot') {
    const xrf = document.getElementById('axes-xrange-field');
    if (xrf) xrf.hidden = false;
  }

  // Pie/donut: hide axes section, show Display toggles
  const _isPieVariant = chartId === 'pie-chart' || chartId === 'donut-chart';
  if (_isPieVariant) {
    document.getElementById('axes-section').hidden  = true;
    document.getElementById('display-section').hidden = false;
    document.getElementById('b-showvalues').checked = bState.options.showValues !== false;
    document.getElementById('b-showlegend').checked = bState.options.showLegend !== false;
    document.getElementById('b-showvalues').addEventListener('change', e => {
      bState.options.showValues = e.target.checked;
      rerender();
    });
    document.getElementById('b-showlegend').addEventListener('change', e => {
      bState.options.showLegend = e.target.checked;
      rerender();
    });
  }

  let currentSVG = '';
  let _editActive = false; // suppresses rerender while an inline edit is open
  let _dmBusy = false;    // suppresses dmSyncManual during modal setup

  function saveState() {
    const snapshot = { chartId, data: bState.data, theme: bState.theme, chartStyle: bState.chartStyle, options: { ...bState.options, selectedBar: -1 } };
    try {
      localStorage.setItem('builderState_' + chartId, JSON.stringify(snapshot));
    } catch (e) {
      // Quota exceeded — retry without the (potentially large) logo data URL
      try {
        snapshot.options = { ...snapshot.options, logoDataUrl: null };
        localStorage.setItem('builderState_' + chartId, JSON.stringify(snapshot));
      } catch (e2) { /* storage full, skip */ }
    }
  }

  function rerender() {
    if (_editActive) return;
    let inner;
    if (chartId === 'bubble-chart') {
      inner = renderBubbleChartInner(bState.theme, bState.data, bState.chartStyle, bState.options);
    } else if (chartId === 'lollipop-chart') {
      inner = renderLollipopChartInner(bState.theme, bState.data, bState.chartStyle, bState.options);
    } else if (chartId === 'dot-plot') {
      inner = renderDotPlotInner(bState.theme, bState.data, bState.chartStyle, bState.options);
    } else if (chartId === 'line-chart') {
      inner = renderLineChartInner(bState.theme, bState.data, bState.chartStyle, bState.options, 'line');
    } else if (chartId === 'area-chart') {
      inner = renderLineChartInner(bState.theme, bState.data, bState.chartStyle, bState.options, 'area');
    } else if (chartId === 'step-chart') {
      inner = renderLineChartInner(bState.theme, bState.data, bState.chartStyle, bState.options, 'step');
    } else if (chartId === 'pie-chart') {
      const res = renderPieChartInner(bState.theme, bState.data, bState.chartStyle, bState.options, 'pie');
      currentSVG = composeSVG(res.content, bState, res.h);
    } else if (chartId === 'donut-chart') {
      const res = renderPieChartInner(bState.theme, bState.data, bState.chartStyle, bState.options, 'donut');
      currentSVG = composeSVG(res.content, bState, res.h);
    } else if (chartId === 'scatter-plot') {
      inner = renderScatterPlotInner(bState.theme, bState.data, bState.chartStyle, bState.options);
    } else {
      inner = renderBarChartInner(bState.theme, bState.data, bState.chartStyle, bState.options);
    }
    if (inner !== undefined) currentSVG = composeSVG(inner, bState);
    document.getElementById('builder-preview').innerHTML = currentSVG;
    saveState();
  }

  function selectBar(i, openPicker) {
    bState.options.selectedBar = i;
    rerender();
    document.querySelectorAll('.data-row').forEach(r => r.classList.remove('is-selected'));
    const row = document.getElementById('data-row-' + i);
    if (row) {
      row.classList.add('is-selected');
      row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      if (openPicker) {
        const input = document.getElementById('data-color-' + i);
        if (input) setTimeout(() => { try { input.showPicker(); } catch(e) { input.click(); } }, 150);
      }
    }
  }

  /* ─────────────────────────────────────────────────────────
     Init
  ───────────────────────────────────────────────────────── */

  // Match preset by bg colour (best-effort)
  const themeKey = Object.keys(PRESETS).find(k => PRESETS[k].bg === bState.theme.bg) || 'default';
  document.getElementById('b-theme').value = themeKey;
  document.getElementById('b-style').value = bState.chartStyle;

  // Schema columns for the current chart (excludes multiple-series columns for now)
  const _schemaCols = schema
    ? schema.columns.filter(c => !c.multiple)
    : [{ key: 'label', label: 'Label', type: 'string', required: true }, { key: 'value', label: 'Value', type: 'number', required: true }];

  // Blank row keyed to current schema
  function _blankRow() {
    const r = {};
    _schemaCols.forEach(c => { r[c.key] = c.type === 'number' ? 0 : ''; });
    return r;
  }

  // Delete-row confirm popover (global so it survives re-renders)
  let _delPopup = null;
  function _dismissDelPopup() { if (_delPopup) { _delPopup.remove(); _delPopup = null; } }
  document.addEventListener('click', e => { if (_delPopup && !_delPopup.contains(e.target)) _dismissDelPopup(); });

  // Colour preset popover
  let _colorPopup = null;
  function _dismissColorPopup() { if (_colorPopup) { _colorPopup.remove(); _colorPopup = null; } }
  document.addEventListener('click', e => { if (_colorPopup && !_colorPopup.contains(e.target)) _dismissColorPopup(); });

  // Data section — schema-driven rows with colour swatch + drag handle
  function populateDataDisplay() {
    const el = document.getElementById('builder-data-display');
    const palette = bState.theme.palette || PRESETS.default.palette;
    const gripperSVG = `<svg class="drag-handle" viewBox="0 0 10 16" width="10" height="16" fill="currentColor" aria-hidden="true"><circle cx="3" cy="3" r="1.2"/><circle cx="7" cy="3" r="1.2"/><circle cx="3" cy="8" r="1.2"/><circle cx="7" cy="8" r="1.2"/><circle cx="3" cy="13" r="1.2"/><circle cx="7" cy="13" r="1.2"/></svg>`;

    el.innerHTML = bState.data.map((row, i) => {
      const color    = bState.options.barColors[i] || palette[i % palette.length];
      const sel      = bState.options.selectedBar === i ? ' is-selected' : '';
      const hasCustom= bState.options.barColors[i] != null && bState.options.barColors[i] !== '';
      const _isPie = ['pie-chart', 'donut-chart'].includes(chartId);
      const inputs   = _schemaCols.map(col => {
        const val  = row[col.key] ?? '';
        const type = col.type === 'number' ? 'number' : 'text';
        const cls  = col.type === 'number' ? 'data-value-input' : 'data-label-input';
        const minAttr = (type === 'number' && _isPie) ? ' min="0"' : '';
        return `<input type="${type}" class="${cls}" id="data-${col.key}-${i}" ` +
               `data-col="${col.key}" data-row="${i}" value="${escAttr(String(val))}" ` +
               `placeholder="${col.label}" step="any"${minAttr}>`;
      }).join('');
      const isLineVariant = ['line-chart', 'area-chart', 'step-chart'].includes(chartId);
      const swatchEl = isLineVariant ? '' :
        `<button class="bar-color-swatch-btn" data-swatch="${i}" style="background:${color};" title="Choose colour"></button>` +
        `<button class="color-reset-btn" data-reset="${i}" title="Reset to theme colour"${hasCustom ? '' : ' style="visibility:hidden"'}>↺</button>`;
      return `<div class="data-row${sel}" id="data-row-${i}" data-row-idx="${i}">` +
        gripperSVG +
        swatchEl +
        inputs +
        `<button class="data-del-btn" data-del="${i}" title="Remove">×</button>` +
      `</div>`;
    }).join('') +
    `<div class="data-section-footer">` +
      `<button class="add-row-btn" id="sidebar-add-row">+ Add row</button>` +
      `<button class="builder-back-link" onclick="openDataModal()">Edit data</button>` +
    `</div>`;

    // Colour swatch button — show theme palette preset popup
    el.querySelectorAll('.bar-color-swatch-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        _dismissColorPopup();
        const i = parseInt(btn.dataset.swatch);
        if (bState.options.selectedBar !== i) selectBar(i, false);
        const palette = bState.theme.palette;
        const popup = document.createElement('div');
        popup.className = 'color-preset-popup';
        const currentColor = bState.options.barColors[i] || palette[i % palette.length];
        popup.innerHTML =
          `<div class="color-preset-dots">${palette.map(c => `<button class="color-preset-dot" data-color="${c}" style="background:${c};" title="${c}"></button>`).join('')}</div>` +
          `<label class="color-preset-custom">Custom…<input type="color" class="color-preset-native" value="${currentColor}"></label>`;
        document.body.appendChild(popup);
        _colorPopup = popup;
        const r = btn.getBoundingClientRect();
        popup.style.left = Math.max(8, r.left) + 'px';
        popup.style.top  = (r.bottom + 6) + 'px';
        popup.querySelectorAll('.color-preset-dot').forEach(dot => {
          dot.addEventListener('click', () => {
            bState.options.barColors[i] = dot.dataset.color;
            _dismissColorPopup();
            rerender();
            populateDataDisplay();
          });
        });
        const nativePicker = popup.querySelector('.color-preset-native');
        nativePicker.addEventListener('input', e => {
          bState.options.barColors[i] = e.target.value;
          btn.style.background = e.target.value;
          rerender();
        });
        nativePicker.addEventListener('change', () => {
          _dismissColorPopup();
          populateDataDisplay();
        });
      });
    });

    // Column inputs — schema-driven update
    el.querySelectorAll('input[data-col]').forEach(input => {
      input.addEventListener('input', e => {
        const col    = e.target.dataset.col;
        const rowIdx = parseInt(e.target.dataset.row);
        if (!bState.data[rowIdx]) return;
        const colDef = _schemaCols.find(c => c.key === col);
        if (colDef?.type === 'number') {
          const v = parseFloat(e.target.value);
          if (!isNaN(v)) bState.data[rowIdx][col] = v;
        } else {
          bState.data[rowIdx][col] = e.target.value;
        }
        rerender();
      });
    });

    // Delete buttons — show confirm popover before removing
    el.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        _dismissDelPopup();
        const i = parseInt(btn.dataset.del);
        const popup = document.createElement('div');
        popup.className = 'del-confirm-popup';
        popup.innerHTML = `<p>Remove this row?</p><div class="del-confirm-btns"><button class="del-confirm-do">Delete</button><button class="del-confirm-cancel">Cancel</button></div>`;
        document.body.appendChild(popup);
        _delPopup = popup;
        // Position above the button
        const r = btn.getBoundingClientRect();
        popup.style.left = Math.max(8, r.left + r.width / 2 - popup.offsetWidth / 2) + 'px';
        popup.style.top  = (r.top - popup.offsetHeight - 8) + 'px';
        popup.querySelector('.del-confirm-do').addEventListener('click', () => {
          _dismissDelPopup();
          bState.data.splice(i, 1);
          bState.options.barColors.splice(i, 1);
          if (bState.options.selectedBar === i) bState.options.selectedBar = -1;
          else if (bState.options.selectedBar > i) bState.options.selectedBar--;
          rerender();
          populateDataDisplay();
        });
        popup.querySelector('.del-confirm-cancel').addEventListener('click', _dismissDelPopup);
      });
    });

    // Add row button
    const addBtn = document.getElementById('sidebar-add-row');
    if (addBtn) {
      addBtn.addEventListener('click', () => {
        bState.data.push(_blankRow());
        rerender();
        populateDataDisplay();
        setTimeout(() => {
          const firstCol = _schemaCols[0]?.key || 'label';
          const input = document.getElementById(`data-${firstCol}-${bState.data.length - 1}`);
          if (input) { input.focus(); input.select(); }
        }, 30);
      });
    }

    // Reset-to-theme colour buttons
    el.querySelectorAll('.color-reset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = parseInt(btn.dataset.reset);
        bState.options.barColors[i] = undefined;
        rerender();
        populateDataDisplay();
      });
    });

    // Drag-to-reorder — mouse events for live nudge + insertion indicator
    el.style.position = 'relative';
    el.querySelectorAll('.drag-handle').forEach(handle => {
      handle.addEventListener('mousedown', e => {
        if (e.button !== 0) return;
        e.preventDefault();

        const rows    = Array.from(el.querySelectorAll('.data-row'));
        const S       = parseInt(handle.closest('.data-row').dataset.rowIdx);
        // Snapshot bounding rects before any transforms
        const oRects  = rows.map(r => r.getBoundingClientRect());
        const rowH    = oRects[0]?.height || 36;

        rows[S].classList.add('is-dragging');
        document.body.style.cursor = 'grabbing';

        const indicator = document.createElement('div');
        indicator.className = 'drag-indicator';
        indicator.style.display = 'none';
        el.appendChild(indicator);

        let T = S;

        const onMove = ev => {
          // Determine insertion index by comparing cursor Y to each row's midpoint
          let newT = rows.length;
          for (let i = 0; i < rows.length; i++) {
            if (i === S) continue;
            if (ev.clientY < oRects[i].top + oRects[i].height / 2) { newT = i; break; }
          }
          T = newT;

          // Nudge: rows between S and T slide out of the way
          rows.forEach((r, i) => {
            if (i === S) return;
            let shift = 0;
            if (T <= S) { if (i >= T && i < S) shift =  rowH; }
            else        { if (i >  S && i < T) shift = -rowH; }
            r.style.transform  = shift ? `translateY(${shift}px)` : '';
            r.style.transition = 'transform 0.12s ease';
          });

          // Insertion line — computed from original rects to avoid reflow
          if (T === S || T === S + 1) { indicator.style.display = 'none'; return; }

          let indVY;
          if (T === 0) {
            indVY = oRects[0].top;
          } else if (T === rows.length) {
            const lastSh = (rows.length - 1 > S && rows.length - 1 < T) ? -rowH : 0;
            indVY = oRects[rows.length - 1].bottom + lastSh;
          } else if (T > S) {
            const prevSh = (T - 1 > S) ? -rowH : 0;
            indVY = oRects[T - 1].bottom + prevSh;
          } else {
            indVY = oRects[T].top;
          }

          const elRect = el.getBoundingClientRect();
          indicator.style.display = 'block';
          indicator.style.top     = (indVY - elRect.top + el.scrollTop) + 'px';
        };

        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup',   onUp);
          document.body.style.cursor = '';
          rows.forEach(r => {
            r.classList.remove('is-dragging');
            r.style.transform  = '';
            r.style.transition = '';
          });
          indicator.remove();

          if (T !== S && T !== S + 1) {
            const dest = T > S ? T - 1 : T;
            const [d] = bState.data.splice(S, 1);
            bState.data.splice(dest, 0, d);
            const [c] = bState.options.barColors.splice(S, 1);
            bState.options.barColors.splice(dest, 0, c);
            if      (bState.options.selectedBar === S) bState.options.selectedBar = dest;
            else if (S < bState.options.selectedBar && dest >= bState.options.selectedBar) bState.options.selectedBar--;
            else if (S > bState.options.selectedBar && dest <= bState.options.selectedBar) bState.options.selectedBar++;
            rerender();
            populateDataDisplay();
          }
        };

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup',   onUp);
      });
    });
  }
  populateDataDisplay();

  rerender();

  // Inline SVG editing
  function startInlineEdit(svgEl, fieldKey) {
    // Only one edit at a time
    if (_editActive) return;

    const _itemLabelMatch = fieldKey.match(/^(?:bar|bubble)-label-(\d+)$/);

    const getVal = () => {
      if (fieldKey === 'title')    return bState.options.title;
      if (fieldKey === 'subtitle') return bState.options.subtitle;
      if (fieldKey === 'source')   return bState.options.source;
      if (_itemLabelMatch) {
        const idx = parseInt(_itemLabelMatch[1]);
        return bState.data[idx]?.label || '';
      }
      return '';
    };

    const setVal = val => {
      if (fieldKey === 'title')    { bState.options.title = val;    const e = document.getElementById('b-title');    if (e) { e.value = val; taAutoH(e); } }
      if (fieldKey === 'subtitle') { bState.options.subtitle = val; const e = document.getElementById('b-subtitle'); if (e) { e.value = val; taAutoH(e); } }
      if (fieldKey === 'source')   { bState.options.source = val;   const e = document.getElementById('b-source');   if (e) { e.value = val; taAutoH(e); } }
      if (_itemLabelMatch) {
        const idx = parseInt(_itemLabelMatch[1]);
        if (bState.data[idx]) bState.data[idx].label = val;
        const e = document.getElementById('data-label-' + idx);
        if (e) e.value = val;
      }
    };

    const origVal = getVal();

    // Hide all same-field SVG elements; find first text element to anchor position
    const svgRoot    = svgEl.closest('svg');
    const allSameKey = Array.from(svgRoot.querySelectorAll(`[data-editable="${fieldKey}"]`));
    allSameKey.forEach(el => el.setAttribute('visibility', 'hidden'));

    // Always open at the first text line so multi-line fields don't jump
    const posEl = allSameKey.find(el => el.tagName.toLowerCase() === 'text') || svgEl;
    const bbox  = posEl.getBBox();
    const ctm   = svgEl.getScreenCTM();
    const pt    = svgEl.ownerSVGElement.createSVGPoint();
    pt.x = bbox.x;
    pt.y = bbox.y;
    const origin = pt.matrixTransform(ctm);

    // Match SVG text appearance
    const tok         = chartTokens(bState.theme, bState.chartStyle);
    const svgFontSize = parseFloat(svgEl.getAttribute('font-size') || '11');
    const isBold      = svgEl.getAttribute('font-weight') === '700';
    const rawFill     = svgEl.getAttribute('fill') || '';
    const svgFill     = (rawFill && rawFill !== 'transparent' && rawFill !== 'none')
                          ? rawFill
                          : (bState.options.labelColor || tok.textColor);
    const bgColor     = bState.options.bgColor || bState.theme.bg;
    const inputFontSz = Math.round(svgFontSize * ctm.a);

    // Wrap at the same max-width used by the SVG renderer so the editor
    // matches the chart layout exactly for all field types
    const isItemLabel = _itemLabelMatch !== null;
    const svgMaxW    = isItemLabel ? Math.max((494 / bState.data.length) - 8, 20) : 512;
    const maxWidthPx = Math.round(svgMaxW * ctm.a);

    const editor = document.createElement('div');
    editor.contentEditable = 'true';
    editor.spellcheck = false;
    // innerHTML so \n in stored values renders as visible line breaks
    editor.innerHTML = origVal
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\n/g, '<br>');
    editor.style.cssText =
      `position:fixed;z-index:9999;` +
      `left:${origin.x - 4}px;top:${origin.y - 2}px;` +
      `display:inline-block;min-width:1ch;` +
      `white-space:normal;word-break:break-word;max-width:${maxWidthPx}px;` +
      `font:${isBold ? '700 ' : ''}${inputFontSz}px ${tok.font};` +
      `color:${svgFill};background:${bgColor};` +
      `padding:0 3px;line-height:1.4;` +
      `border:none;border-bottom:1.5px solid rgba(59,130,246,0.65);outline:none;`;

    document.body.appendChild(editor);
    _editActive = true;

    // Select all on open
    editor.focus();
    const sel = window.getSelection();
    const rng = document.createRange();
    rng.selectNodeContents(editor);
    sel.removeAllRanges();
    sel.addRange(rng);

    // Paste as plain text only
    editor.addEventListener('paste', e => {
      e.preventDefault();
      const text = e.clipboardData.getData('text/plain');
      document.execCommand('insertText', false, text);
    });

    editor.addEventListener('input', () => {
      // innerText preserves \n for <br>; trim any trailing newline browsers append
      setVal((editor.innerText || '').replace(/\n$/, ''));
    });

    editor.addEventListener('keydown', e => {
      // Plain Enter commits; Shift+Enter inserts a line break
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); editor.blur(); }
      if (e.key === 'Escape') { setVal(origVal); _editActive = false; editor.remove(); rerender(); }
    });

    editor.addEventListener('blur', () => {
      _editActive = false;
      editor.remove();
      rerender();
    });
  }

  // Preview click delegation
  document.getElementById('builder-preview').addEventListener('click', e => {
    const editEl = e.target.closest('[data-editable]');
    if (editEl) {
      const key = editEl.dataset.editable;
      if (key === 'logo') {
        document.getElementById('b-logo-input').click();
      } else {
        startInlineEdit(editEl, key);
      }
      return;
    }

    const barEl = e.target.closest('[data-bar-idx]');
    if (barEl) {
      selectBar(parseInt(barEl.dataset.barIdx), true);
    } else if (bState.options.selectedBar !== -1) {
      bState.options.selectedBar = -1;
      document.querySelectorAll('.data-row').forEach(r => r.classList.remove('is-selected'));
      rerender();
    }
  });

  /* ─────────────────────────────────────────────────────────
     Config wiring
  ───────────────────────────────────────────────────────── */

  const taAutoH = ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
  document.getElementById('b-title').addEventListener('input', e => { bState.options.title = e.target.value; rerender(); taAutoH(e.target); });
  document.getElementById('b-subtitle').addEventListener('input', e => { bState.options.subtitle = e.target.value; rerender(); taAutoH(e.target); });
  document.getElementById('b-source').addEventListener('input', e => { bState.options.source = e.target.value; rerender(); taAutoH(e.target); });
  document.getElementById('b-xlabel').addEventListener('input', e => { bState.options.xLabel = e.target.value; rerender(); });
  document.getElementById('b-ylabel').addEventListener('input', e => { bState.options.yLabel = e.target.value; rerender(); });
  document.getElementById('b-ymin').addEventListener('input', e => { bState.options.yMin = e.target.value; rerender(); });
  document.getElementById('b-ymax').addEventListener('input', e => { bState.options.yMax = e.target.value; rerender(); });
  document.getElementById('b-xmin').addEventListener('input', e => { bState.options.xMin = e.target.value; rerender(); });
  document.getElementById('b-xmax').addEventListener('input', e => { bState.options.xMax = e.target.value; rerender(); });

  document.getElementById('b-theme').addEventListener('change', e => {
    bState.theme = PRESETS[e.target.value] || PRESETS.default;
    // Keep bg picker display in sync when Auto mode is active
    if (!bState.options.bgColor) {
      bgColorInput.value = bState.theme.bg;
      bgColorHex.textContent = bState.theme.bg;
    }
    rerender();
    populateDataDisplay(); // refresh default colour swatches for new theme
  });
  document.getElementById('b-style').addEventListener('change', e => {
    bState.chartStyle = e.target.value;
    rerender();
  });

  document.getElementById('b-logo-input').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const nameEl = document.getElementById('b-logo-name');
    nameEl.textContent = file.name; nameEl.hidden = false;
    const reader = new FileReader();
    reader.onload = ev => { bState.options.logoDataUrl = ev.target.result; document.getElementById('b-logosize-field').hidden = false; rerender(); };
    reader.readAsDataURL(file);
  });

  document.getElementById('b-logosize').addEventListener('input', e => {
    bState.options.logoSize = parseInt(e.target.value);
    document.getElementById('b-logosize-val').textContent = e.target.value + 'px';
    rerender();
  });

  // Background colour
  const bgColorInput = document.getElementById('b-bgcolor');
  const bgColorHex   = document.getElementById('b-bgcolor-hex');
  const bgColorAuto  = document.getElementById('b-bgcolor-auto');

  bgColorInput.value = bState.theme.bg;
  bgColorHex.textContent = bState.theme.bg;

  bgColorInput.addEventListener('input', e => {
    bState.options.bgColor = e.target.value;
    bgColorHex.textContent = e.target.value;
    bgColorAuto.classList.remove('is-auto');
    rerender();
  });

  bgColorAuto.addEventListener('click', () => {
    bState.options.bgColor = '';
    bgColorAuto.classList.add('is-auto');
    rerender();
  });

  // Font colour — picker activates custom mode; Auto button resets to theme-derived
  const fontColorInput = document.getElementById('b-fontcolor');
  const fontColorHex   = document.getElementById('b-fontcolor-hex');
  const fontColorAuto  = document.getElementById('b-fontcolor-auto');

  // Initialise picker to match starting theme
  const _initDark = isColorDark(bState.theme.bg);
  fontColorInput.value = _initDark ? '#e2e8f0' : '#1a1816';
  fontColorHex.textContent = fontColorInput.value;

  fontColorInput.addEventListener('input', e => {
    bState.options.fontColor = e.target.value;
    fontColorHex.textContent = e.target.value;
    fontColorAuto.classList.remove('is-auto');
    rerender();
  });

  fontColorAuto.addEventListener('click', () => {
    bState.options.fontColor = '';
    fontColorAuto.classList.add('is-auto');
    rerender();
  });

  // Label colour — controls chart display text (axis ticks, percentages, legend, data labels)
  const labelColorInput = document.getElementById('b-labelcolor');
  const labelColorHex   = document.getElementById('b-labelcolor-hex');
  const labelColorAuto  = document.getElementById('b-labelcolor-auto');

  labelColorInput.value = _initDark ? '#e2e8f0' : '#1a1816';
  labelColorHex.textContent = labelColorInput.value;

  labelColorInput.addEventListener('input', e => {
    bState.options.labelColor = e.target.value;
    labelColorHex.textContent = e.target.value;
    labelColorAuto.classList.remove('is-auto');
    rerender();
  });

  labelColorAuto.addEventListener('click', () => {
    bState.options.labelColor = '';
    labelColorAuto.classList.add('is-auto');
    rerender();
  });

  const interactiveToggle = document.getElementById('b-interactive');
  interactiveToggle.checked = bState.options.interactive || false;
  interactiveToggle.addEventListener('change', e => {
    bState.options.interactive = e.target.checked;
    rerender();
  });

  // Line colour — only shown for line/area/step charts
  const _isLineVariant = ['line-chart', 'area-chart', 'step-chart'].includes(chartId);
  if (_isLineVariant) {
    document.getElementById('line-color-field').hidden = false;
    const lineColorInput = document.getElementById('b-linecolor');
    const lineColorHex   = document.getElementById('b-linecolor-hex');
    const lineColorAuto  = document.getElementById('b-linecolor-auto');
    const _initLineColor = bState.options.barColors[0] || bState.theme.palette[0] || '#3b82f6';
    lineColorInput.value       = _initLineColor;
    lineColorHex.textContent   = _initLineColor;
    if (bState.options.barColors[0]) lineColorAuto.classList.remove('is-auto');
    lineColorInput.addEventListener('input', e => {
      bState.options.barColors[0] = e.target.value;
      lineColorHex.textContent = e.target.value;
      lineColorAuto.classList.remove('is-auto');
      rerender();
    });
    lineColorAuto.addEventListener('click', () => {
      bState.options.barColors[0] = undefined;
      lineColorAuto.classList.add('is-auto');
      rerender();
    });
  }

  // Restore UI controls from saved options (runs once after all controls are wired up)
  {
    const o = bState.options;
    if (o.title)    { const e = document.getElementById('b-title');    if (e) { e.value = o.title;    taAutoH(e); } }
    if (o.subtitle) { const e = document.getElementById('b-subtitle'); if (e) { e.value = o.subtitle; taAutoH(e); } }
    if (o.source)   { const e = document.getElementById('b-source');   if (e) { e.value = o.source;   taAutoH(e); } }
    if (o.xLabel)   { const e = document.getElementById('b-xlabel');   if (e) e.value = o.xLabel; }
    if (o.yLabel)   { const e = document.getElementById('b-ylabel');   if (e) e.value = o.yLabel; }
    if (o.bgColor)    { bgColorInput.value = o.bgColor;       bgColorHex.textContent = o.bgColor;       bgColorAuto.classList.remove('is-auto'); }
    if (o.fontColor)  { fontColorInput.value = o.fontColor;   fontColorHex.textContent = o.fontColor;   fontColorAuto.classList.remove('is-auto'); }
    if (o.labelColor) { labelColorInput.value = o.labelColor; labelColorHex.textContent = o.labelColor; labelColorAuto.classList.remove('is-auto'); }
    interactiveToggle.checked = o.interactive || false;
  }

  /* ─────────────────────────────────────────────────────────
     Export
  ───────────────────────────────────────────────────────── */

  function showFeedback(msg) {
    const el = document.getElementById('export-feedback');
    el.textContent = msg;
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.textContent = ''; }, 2200);
  }

  document.getElementById('b-copy-svg').addEventListener('click', () => {
    navigator.clipboard.writeText(currentSVG)
      .then(() => showFeedback('SVG copied to clipboard'))
      .catch(() => showFeedback('Copy failed — try Download SVG'));
  });

  document.getElementById('b-dl-svg').addEventListener('click', () => {
    const blob = new Blob([currentSVG], { type: 'image/svg+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'chart.svg';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  document.getElementById('b-dl-png').addEventListener('click', () => {
    const blob = new Blob([currentSVG], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const m = currentSVG.match(/viewBox="0 0 (\d+) (\d+)"/);
      const w = m ? parseInt(m[1]) : 560;
      const h = m ? parseInt(m[2]) : 300;
      const scale = 2;
      const canvas = document.createElement('canvas');
      canvas.width = w * scale;
      canvas.height = h * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = 'chart.png';
      a.click();
      URL.revokeObjectURL(url);
    };
    img.src = url;
  });

  document.getElementById('b-copy-embed').addEventListener('click', () => {
    let snippet;
    if (bState.options.interactive) {
      snippet = `<div style="display:inline-block;max-width:100%;overflow:hidden">${currentSVG}</div>`;
    } else {
      const b64 = btoa(unescape(encodeURIComponent(currentSVG)));
      snippet = `<img src="data:image/svg+xml;base64,${b64}" alt="Chart" style="max-width:100%">`;
    }
    navigator.clipboard.writeText(snippet)
      .then(() => showFeedback(bState.options.interactive ? 'Interactive embed copied' : 'Embed snippet copied'))
      .catch(() => showFeedback('Copy failed'));
  });

  /* ─────────────────────────────────────────────────────────
     Data edit modal
  ───────────────────────────────────────────────────────── */

  function parseCSV(text) {
    const lines = text.trim().split('\n').filter(l => l.trim());
    if (!lines.length) return [];
    const rows = lines.map(l => l.split(',').map(s => s.trim()));
    // Detect header: any numeric column that has a non-numeric value in row 0
    const numericIdxs = _schemaCols.map((c, i) => c.type === 'number' ? i : -1).filter(i => i >= 0);
    const hasHeader = numericIdxs.length ? numericIdxs.some(i => isNaN(rows[0]?.[i])) : isNaN(rows[0]?.[1]);
    const dataRows = hasHeader ? rows.slice(1) : rows;
    return dataRows
      .map(r => {
        const row = {};
        _schemaCols.forEach((col, i) => {
          row[col.key] = col.type === 'number' ? parseFloat(r[i]) : (r[i] || '');
        });
        return row;
      })
      .filter(r => _schemaCols.filter(c => c.required).every(c =>
        c.type === 'number' ? !isNaN(r[c.key]) : r[c.key] !== ''
      ));
  }

  function dataToCSV(data) {
    const header = _schemaCols.map(c => c.label).join(',');
    return header + '\n' + data.map(r => _schemaCols.map(c => r[c.key] ?? '').join(',')).join('\n');
  }

  function dmAddRow(tbody, rowData) {
    const tr = document.createElement('tr');
    const cells = _schemaCols.map(col => {
      const val = rowData?.[col.key] ?? '';
      const type = col.type === 'number' ? 'number' : 'text';
      const displayVal = val !== '' ? escAttr(String(val)) : '';
      const minAttr = (type === 'number' && ['pie-chart', 'donut-chart'].includes(chartId)) ? ' min="0"' : '';
      return `<td><input class="manual-cell" type="${type}" placeholder="${escAttr(col.label)}" value="${displayVal}" step="any"${minAttr}></td>`;
    }).join('');
    tr.innerHTML = cells + `<td><button class="manual-del-btn" title="Remove">×</button></td>`;
    tr.querySelector('.manual-del-btn').addEventListener('click', () => { tr.remove(); dmSyncManual(); });
    tr.querySelectorAll('.manual-cell').forEach(inp => inp.addEventListener('input', dmSyncManual));
    tbody.appendChild(tr);
  }

  function dmSyncManual() {
    if (_dmBusy) return;
    const rows = [];
    document.querySelectorAll('#dm-manual-tbody tr').forEach(tr => {
      const cells = tr.querySelectorAll('.manual-cell');
      const row = {};
      _schemaCols.forEach((col, i) => {
        const val = cells[i]?.value;
        row[col.key] = col.type === 'number' ? parseFloat(val) : (val?.trim() || '');
      });
      const reqValid = _schemaCols.filter(c => c.required).every(c =>
        c.type === 'number' ? !isNaN(row[c.key]) : row[c.key] !== ''
      );
      if (reqValid) rows.push(row);
    });
    if (rows.length) dmApplyData(rows);
  }

  function dmApplyData(rows) {
    bState.data = rows;
    bState.options.barColors = bState.options.barColors.slice(0, rows.length);
    bState.options.selectedBar = -1;
    rerender();
    populateDataDisplay();
  }

  function setDmTab(name) {
    document.querySelectorAll('.dm-tab').forEach(t => t.classList.toggle('active', t.dataset.input === name));
    ['manual', 'paste', 'upload'].forEach(n => {
      document.getElementById('dm-input-' + n).hidden = n !== name;
    });
  }

  function openDataModal() {
    _dmBusy = true;
    // Update table headers from schema
    const thead = document.querySelector('#dm-manual-table thead tr');
    if (thead) thead.innerHTML = _schemaCols.map(c => {
      const tip = c.tooltip ? `<span class="col-tip" data-tip="${escAttr(c.tooltip)}">i</span>` : '';
      return `<th>${c.label}${tip}</th>`;
    }).join('') + '<th></th>';

    // Update CSV paste placeholder from schema
    const pasteTA = document.getElementById('dm-csv-paste');
    if (pasteTA) {
      const exRow = _schemaCols.map(c => c.example ?? (c.type === 'number' ? '0' : 'Item')).join(',');
      pasteTA.placeholder = _schemaCols.map(c => c.label).join(',') + '\n' + exRow;
    }

    // Pre-populate Manual table
    const tbody = document.getElementById('dm-manual-tbody');
    tbody.innerHTML = '';
    if (bState.data.length) {
      bState.data.forEach(r => dmAddRow(tbody, r));
    } else {
      dmAddRow(tbody, null);
    }
    // Pre-populate Paste textarea
    document.getElementById('dm-csv-paste').value = bState.data.length ? dataToCSV(bState.data) : '';
    // Reset to Manual tab
    setDmTab('manual');
    // Clear upload filename
    document.getElementById('dm-upload-filename').hidden = true;
    document.getElementById('dm-upload-filename').textContent = '';
    _dmBusy = false;
    document.getElementById('data-edit-modal').hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function closeDataModal() {
    document.getElementById('data-edit-modal').hidden = true;
    document.body.style.overflow = '';
  }

  // Tab switching
  document.querySelectorAll('.dm-tab').forEach(tab => {
    tab.addEventListener('click', () => setDmTab(tab.dataset.input));
  });

  // Paste CSV
  document.getElementById('dm-csv-paste').addEventListener('input', e => {
    const rows = parseCSV(e.target.value);
    if (rows.length) dmApplyData(rows);
  });

  // Manual table — add row
  document.getElementById('dm-add-row-btn').addEventListener('click', () => {
    dmAddRow(document.getElementById('dm-manual-tbody'), null);
  });

  // File upload
  const dmFileInput = document.getElementById('dm-file-input');
  const dmUploadLabel = document.getElementById('dm-upload-label');
  const dmUploadFilename = document.getElementById('dm-upload-filename');

  function dmReadFile(file) {
    if (!file) return;
    dmUploadFilename.textContent = file.name;
    dmUploadFilename.hidden = false;
    const reader = new FileReader();
    reader.onload = ev => {
      const rows = parseCSV(ev.target.result);
      if (rows.length) dmApplyData(rows);
    };
    reader.readAsText(file);
  }

  dmFileInput.addEventListener('change', e => dmReadFile(e.target.files[0]));
  dmUploadLabel.addEventListener('dragover', e => { e.preventDefault(); dmUploadLabel.classList.add('drag-over'); });
  dmUploadLabel.addEventListener('dragleave', () => dmUploadLabel.classList.remove('drag-over'));
  dmUploadLabel.addEventListener('drop', e => {
    e.preventDefault();
    dmUploadLabel.classList.remove('drag-over');
    dmReadFile(e.dataTransfer.files[0]);
  });

  // Done + Escape
  document.getElementById('dm-done-btn').addEventListener('click', closeDataModal);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !document.getElementById('data-edit-modal').hidden) closeDataModal();
  });

  </script>
</body>
</html>
