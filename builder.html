<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chart Builder — data-viz-lib</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="builder-page">

  <header class="builder-header">
    <a href="index.html" class="builder-back">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Library
    </a>
    <span class="builder-header-title" id="builder-title">Chart Builder</span>
    <span></span>
  </header>

  <div class="builder-layout">

    <!-- ── Config panel ──────────────────────────────────── -->
    <aside class="builder-config">

      <div class="config-section">
        <div class="config-section-header">Data</div>
        <div id="builder-data-display"></div>
      </div>

      <div class="config-section">
        <div class="config-section-header">Metadata</div>
        <div class="config-field">
          <label>Title</label>
          <textarea id="b-title" placeholder="Chart title" rows="1"></textarea>
        </div>
        <div class="config-field">
          <label>Subtitle</label>
          <textarea id="b-subtitle" placeholder="A brief description" rows="1"></textarea>
        </div>
        <div class="config-field">
          <label>Source</label>
          <textarea id="b-source" placeholder="Data: Source name, 2024" rows="1"></textarea>
        </div>
        <div class="config-field">
          <label>Logo</label>
          <label class="logo-upload-btn" for="b-logo-input">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M7 9V3M4.5 5.5L7 3l2.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 11v.5a.5.5 0 00.5.5h9a.5.5 0 00.5-.5V11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            Upload logo
          </label>
          <input type="file" id="b-logo-input" accept="image/*" hidden />
          <span class="b-logo-name" id="b-logo-name" hidden></span>
        </div>
        <div class="config-field" id="b-logosize-field" hidden>
          <label>Logo size <span class="config-field-value" id="b-logosize-val">12px</span></label>
          <input type="range" class="config-range" id="b-logosize" min="4" max="25" step="1" value="12" />
        </div>
      </div>

      <div class="config-section" id="axes-section">
        <div class="config-section-header">Axes</div>
        <div class="config-field">
          <label>X-axis label</label>
          <input type="text" class="axis-label-input" id="b-xlabel" placeholder="Category" />
        </div>
        <div class="config-field">
          <label>Y-axis label</label>
          <input type="text" class="axis-label-input" id="b-ylabel" placeholder="Value" />
        </div>
        <div class="config-field">
          <label>Y-axis range</label>
          <div class="axis-range-row">
            <input type="number" class="axis-range-input" id="b-ymin" placeholder="Auto" />
            <span class="axis-range-sep">–</span>
            <input type="number" class="axis-range-input" id="b-ymax" placeholder="Auto" />
          </div>
        </div>
        <div class="config-field" id="axes-xrange-field" hidden>
          <label>X-axis range</label>
          <div class="axis-range-row">
            <input type="number" class="axis-range-input" id="b-xmin" placeholder="Auto" />
            <span class="axis-range-sep">–</span>
            <input type="number" class="axis-range-input" id="b-xmax" placeholder="Auto" />
          </div>
        </div>
      </div>

      <div class="config-section" id="display-section" hidden>
        <div class="config-section-header">Display</div>
        <div class="config-field config-field-check">
          <label for="b-showvalues">Show percentages</label>
          <input type="checkbox" id="b-showvalues" checked />
        </div>
        <div class="config-field config-field-check">
          <label for="b-showlegend">Show legend</label>
          <input type="checkbox" id="b-showlegend" checked />
        </div>
      </div>

      <div class="config-section">
        <div class="config-section-header">Appearance</div>
        <div class="config-field">
          <label>Theme</label>
          <select id="b-theme">
            <option value="default">Default</option>
            <option value="bold">Bold</option>
            <option value="earth">Earth</option>
            <option value="dark">Dark</option>
            <option value="journeys">Journeys</option>
          </select>
        </div>
        <div class="config-field">
          <label>Style</label>
          <select id="b-style">
            <option value="modern">Modern</option>
            <option value="minimal">Minimal</option>
            <option value="classic">Classic</option>
            <option value="neon">Neon</option>
            <option value="editorial">Editorial</option>
            <option value="journeys">Journeys</option>
          </select>
        </div>
        <div class="config-field">
          <label>Background colour</label>
          <div class="b-color-row">
            <input type="color" class="b-color-picker" id="b-bgcolor" value="#ffffff" />
            <span class="b-color-hex" id="b-bgcolor-hex">#ffffff</span>
            <button class="b-color-auto is-auto" id="b-bgcolor-auto">Auto</button>
          </div>
        </div>
        <div class="config-field">
          <label>Title colour</label>
          <div class="b-color-row">
            <input type="color" class="b-color-picker" id="b-fontcolor" value="#1a1816" />
            <span class="b-color-hex" id="b-fontcolor-hex">#1a1816</span>
            <button class="b-color-auto is-auto" id="b-fontcolor-auto">Auto</button>
          </div>
        </div>
        <div class="config-field">
          <label>Label colour</label>
          <div class="b-color-row">
            <input type="color" class="b-color-picker" id="b-labelcolor" value="#1a1816" />
            <span class="b-color-hex" id="b-labelcolor-hex">#1a1816</span>
            <button class="b-color-auto is-auto" id="b-labelcolor-auto">Auto</button>
          </div>
        </div>
        <div class="config-field" id="line-color-field" hidden>
          <label>Line colour</label>
          <div class="b-color-row">
            <input type="color" class="b-color-picker" id="b-linecolor" value="#3b82f6" />
            <span class="b-color-hex" id="b-linecolor-hex">#3b82f6</span>
            <button class="b-color-auto is-auto" id="b-linecolor-auto">Auto</button>
          </div>
        </div>
      </div>

      <div class="config-section">
        <div class="config-section-header">Export</div>
        <div class="export-btns">
          <button class="export-btn" id="b-copy-svg">Copy SVG</button>
          <button class="export-btn" id="b-dl-svg">Download SVG</button>
          <button class="export-btn" id="b-dl-png">Download PNG</button>
          <button class="export-btn" id="b-copy-embed">Copy Embed</button>
        </div>
        <label class="b-interactive-label">
          <input type="checkbox" id="b-interactive"> Interactive embed
        </label>
        <p class="b-interactive-hint">Hover tooltips on chart elements. Uses inline SVG (not &lt;img&gt;).</p>
        <div class="export-feedback" id="export-feedback"></div>
      </div>

    </aside>

    <!-- ── Live preview ───────────────────────────────────── -->
    <div class="builder-preview">
      <div class="builder-preview-inner" id="builder-preview"></div>
    </div>

  </div>

  <!-- ── Data edit modal ────────────────────────────────── -->
  <div id="data-edit-modal" hidden>
    <div class="data-modal-backdrop" onclick="closeDataModal()"></div>
    <div class="data-modal-panel">
      <div class="data-modal-header">
        <span class="data-modal-title">Edit data</span>
        <button class="data-modal-close" onclick="closeDataModal()" aria-label="Close">×</button>
      </div>

      <div class="dm-input-tabs">
        <button class="dm-tab active" data-input="manual">Manual</button>
        <button class="dm-tab" data-input="paste">Paste CSV</button>
        <button class="dm-tab" data-input="upload">Upload</button>
      </div>

      <div class="dm-input-panel" id="dm-input-manual">
        <table class="manual-table" id="dm-manual-table">
          <thead><tr><th>Label</th><th>Value</th><th></th></tr></thead>
          <tbody id="dm-manual-tbody"></tbody>
        </table>
        <button class="add-row-btn" id="dm-add-row-btn">+ Add row</button>
      </div>

      <div class="dm-input-panel" id="dm-input-paste" hidden>
        <textarea id="dm-csv-paste" placeholder="Label,Value&#10;Apples,85&#10;Oranges,62&#10;Bananas,108"></textarea>
      </div>

      <div class="dm-input-panel" id="dm-input-upload" hidden>
        <label class="file-upload-area" id="dm-upload-label">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M12 16V8M9 11l3-3 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>Drop a CSV file here, or click to browse</span>
          <input type="file" id="dm-file-input" accept=".csv" hidden>
        </label>
        <p class="upload-filename" id="dm-upload-filename" hidden></p>
      </div>

      <div class="data-modal-footer">
        <button class="build-cta-btn" id="dm-done-btn">Done</button>
      </div>
    </div>
  </div>

  <script src="schemas.js"></script>
  <script>
  /* ─────────────────────────────────────────────────────────
     Self-contained helpers (copied from app.js)
  ───────────────────────────────────────────────────────── */

  const PRESETS = {
    default:  { bg:'#ffffff', palette:['#3B82F6','#10B981','#F59E0B','#EF4444','#8B5CF6','#EC4899'], font:'Inter' },
    bold:     { bg:'#fff7f7', palette:['#EF4444','#F97316','#FBBF24','#84CC16','#06B6D4','#8B5CF6'], font:'Inter' },
    earth:    { bg:'#faf7f2', palette:['#92400E','#B45309','#D97706','#65A30D','#047857','#6B7280'], font:"'Georgia', serif" },
    dark:     { bg:'#111111', palette:['#CCCCCC','#999999','#666666','#444444','#EEEEEE','#222222'], font:'Inter' },
    journeys: { bg:'#EEF5FB', palette:['#5BADE0','#3DC4A0','#E8705A','#D966A8','#9070C8','#6A52A8'], font:"'Inter', sans-serif" },
  };

  const CHART_STYLES = {
    modern:    { barRadius:5,  gridScale:1,  gridDash:'',    strokeW:2.5, fontOverride:null,                         glow:false, axisLabels:true  },
    minimal:   { barRadius:2,  gridScale:0,  gridDash:'',    strokeW:1.5, fontOverride:null,                         glow:false, axisLabels:false },
    classic:   { barRadius:0,  gridScale:3,  gridDash:'',    strokeW:1.5, fontOverride:'Georgia, serif',             glow:false, axisLabels:true  },
    neon:      { barRadius:1,  gridScale:1,  gridDash:'3 3', strokeW:2,   fontOverride:'"Courier New", monospace',   glow:true,  axisLabels:true  },
    editorial: { barRadius:0,  gridScale:5,  gridDash:'',    strokeW:3,   fontOverride:null,                         glow:false, axisLabels:true  },
    journeys:  { barRadius:12, gridScale:0,  gridDash:'',    strokeW:2,   fontOverride:"'Inter', sans-serif",        glow:false, axisLabels:true  },
  };

  function isColorDark(hex) {
    const c = hex.replace('#','');
    if (c.length < 6) return false;
    const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    return (0.299*r + 0.587*g + 0.114*b) < 128;
  }

  function niceScale(maxVal, tickCount = 4) {
    const rawStep = (maxVal * 1.2) / tickCount;
    const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const norm = rawStep / mag;
    const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
    const max = Math.ceil((maxVal * 1.2) / step) * step;
    const ticks = [];
    for (let v = 0; v <= max + step * 0.001; v += step) ticks.push(Math.round(v));
    return { max, ticks };
  }

  function customScale(min, max, tickCount = 4) {
    const range = (max - min) || 1;
    const step = range / tickCount;
    const ticks = [];
    for (let i = 0; i <= tickCount; i++) {
      ticks.push(parseFloat((min + i * step).toPrecision(6)));
    }
    return { max, ticks };
  }

  function fmtTick(v) {
    if (v === 0) return '0';
    const abs = Math.abs(v);
    if (abs >= 1e6) return (+(v / 1e6).toPrecision(2)) + 'M';
    if (abs >= 1e3) return (+(v / 1e3).toPrecision(2)) + 'K';
    return String(+v.toPrecision(2));
  }

  function chartTokens(theme, chartStyle) {
    const dark = isColorDark(theme.bg);
    const sty = CHART_STYLES[chartStyle] || CHART_STYLES.modern;
    const ch = dark ? '255,255,255' : '0,0,0';
    const gridOpacity = Math.min(0.9, (dark ? 0.06 : 0.05) * sty.gridScale).toFixed(3);
    return {
      textColor:  dark ? 'rgba(255,255,255,0.4)'  : 'rgba(0,0,0,0.32)',
      gridColor:  `rgba(${ch},${gridOpacity})`,
      baseColor:  dark ? 'rgba(255,255,255,0.14)' : 'rgba(0,0,0,0.10)',
      font:       sty.fontOverride || ((theme.font || 'Inter') + ', sans-serif'),
      c0:         theme.palette[0],
      barRadius:  sty.barRadius,
      gridDash:   sty.gridDash,
      glow:       sty.glow,
      glowSD:     sty.glowSD || 3,
      axisLabels: sty.axisLabels,
    };
  }

  /* Returns inner SVG content only (no wrapping <svg> or background rect) */
  /* Build a CSS-hover tooltip <g class="tt"> for interactive SVG embeds.
     tipCx/tipCy: anchor point (e.g. bar top, dot centre).
     above: if true, box appears above the anchor; false = below.
     chartW: SVG width used to clamp horizontal position. */
  function makeTT(tipCx, tipCy, text, font, textColor, bg, above, chartW) {
    chartW = chartW || 560;
    above  = above !== false;
    const cw = Math.max(60, Math.min(200, text.length * 7 + 20));
    const ch = 22;
    const tx = Math.max(4, Math.min(chartW - cw - 4, tipCx - cw / 2));
    const ty = above ? tipCy - ch - 8 : tipCy + 8;
    return `<g class="tt"><rect rx="4" x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" width="${cw}" height="${ch}" fill="${bg}" opacity="0.95" stroke="${textColor}" stroke-width="0.5" stroke-opacity="0.25"/><text x="${(tx + cw / 2).toFixed(1)}" y="${(ty + 15).toFixed(1)}" font-size="11" font-family="${font}" fill="${textColor}" text-anchor="middle">${escSVG(text)}</text></g>`;
  }

  function renderBarChartInner(theme, data, chartStyle, options) {
    const W = 560, H = 300;
    const pad = { top: 16, right: 16, bottom: 40, left: 50 };
    const cW = W - pad.left - pad.right;
    const effectiveTheme = options?.bgColor ? { ...theme, bg: options.bgColor } : theme;
    const tok = chartTokens(effectiveTheme, chartStyle);
    const { gridColor, baseColor, font, c0, barRadius, gridDash, glow, glowSD, axisLabels } = tok;
    const textColor = options?.labelColor || tok.textColor;

    // Scale — respect custom yMin/yMax if provided
    const dataMax = Math.max(...data.map(d => d.value), 1); // floor of 1 avoids division-by-zero on all-zero data
    const yMaxOpt = options?.yMax !== '' && options?.yMax !== undefined && !isNaN(+options.yMax) ? +options.yMax : null;
    const yMinOpt = options?.yMin !== '' && options?.yMin !== undefined && !isNaN(+options.yMin) ? +options.yMin : 0;
    const { max, ticks } = yMaxOpt !== null ? customScale(yMinOpt, yMaxOpt) : niceScale(dataMax);
    const scaleMin = yMaxOpt !== null ? yMinOpt : 0;

    const slot = cW / data.length;
    const bW = Math.round(slot * 0.52);

    // Pre-compute wrapped labels so we can dynamically size pad.bottom
    const labelMaxW = Math.max(slot - 8, 20);
    const wrappedLabels = data.map(d =>
      axisLabels ? wrapSVGText(d.label, labelMaxW, 11, false, font) : []
    );
    const maxLabelLines = Math.max(...wrappedLabels.map(ls => ls.length), 1);
    pad.bottom = Math.max(40, 24 + maxLabelLines * 13);
    const xLabelLines = (options?.xLabel && axisLabels) ? wrapSVGText(options.xLabel, W - 100, 11, false, font) : [];
    if (xLabelLines.length) pad.bottom += 14 + xLabelLines.length * 14;
    const yLabelLines = (options?.yLabel && axisLabels) ? wrapSVGText(options.yLabel, 220, 11, false, font) : [];
    if (yLabelLines.length) pad.left = Math.max(pad.left, 54 + (yLabelLines.length - 1) * 14);

    const cH = H - pad.top - pad.bottom;
    const xMid = i => pad.left + slot * i + slot / 2;
    const yV   = v => pad.top + cH - ((v - scaleMin) / (max - scaleMin)) * cH;
    const yBase = pad.top + cH;
    const r = barRadius;
    const dash = gridDash ? ` stroke-dasharray="${gridDash}"` : '';

    const grid = ticks.map(t => {
      const y = yV(t).toFixed(1);
      const lbl = axisLabels
        ? `<text x="${pad.left - 8}" y="${(+y + 4).toFixed(1)}" text-anchor="end" font-size="11" font-family="${font}" fill="${textColor}">${fmtTick(t)}</text>`
        : '';
      return `<line x1="${pad.left}" y1="${y}" x2="${W - pad.right}" y2="${y}" stroke="${t === scaleMin ? baseColor : gridColor}" stroke-width="1"${dash}/>${lbl}`;
    }).join('');

    const fid = glow ? 'gf' + Math.random().toString(36).slice(2, 7) : '';
    const filterDef = glow
      ? `<filter id="${fid}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceGraphic" stdDeviation="${glowSD}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`
      : '';

    const interactive = options?.interactive || false;
    const bars = data.map((d, i) => {
      const x = xMid(i) - bW / 2, y = yV(d.value), h = yBase - y;
      const fill = options?.barColors?.[i] || c0;
      const isSelected = options?.selectedBar === i;
      const bar = r === 0 || h <= r
        ? `<rect data-bar-idx="${i}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bW}" height="${h.toFixed(1)}" fill="${fill}"/>`
        : `<path data-bar-idx="${i}" d="M${x.toFixed(1)},${(y+h).toFixed(1)} L${x.toFixed(1)},${(y+r).toFixed(1)} Q${x.toFixed(1)},${y.toFixed(1)} ${(x+r).toFixed(1)},${y.toFixed(1)} L${(x+bW-r).toFixed(1)},${y.toFixed(1)} Q${(x+bW).toFixed(1)},${y.toFixed(1)} ${(x+bW).toFixed(1)},${(y+r).toFixed(1)} L${(x+bW).toFixed(1)},${(y+h).toFixed(1)} Z" fill="${fill}"/>`;
      const ring = isSelected
        ? `<rect x="${(x-2.5).toFixed(1)}" y="${(y-2.5).toFixed(1)}" width="${(bW+5).toFixed(1)}" height="${(h+5).toFixed(1)}" fill="none" stroke="${fill}" stroke-width="2" opacity="0.5" rx="${r > 0 ? r + 2 : 0}"/>`
        : '';
      const lbl = wrappedLabels[i].map((line, li) =>
        `<text data-editable="bar-label-${i}" x="${xMid(i).toFixed(1)}" y="${(pad.top + cH + 16 + li * 13).toFixed(1)}" text-anchor="middle" font-size="11" font-family="${font}" fill="${textColor}">${escSVG(line)}</text>`
      ).join('');
      // Invisible hit-area keeps the label zone clickable even when the label is empty
      const labelHit = axisLabels
        ? `<rect data-editable="bar-label-${i}" x="${(xMid(i) - slot / 2 + 2).toFixed(1)}" y="${(pad.top + cH + 4).toFixed(1)}" width="${(slot - 4).toFixed(1)}" height="${(pad.bottom - 8).toFixed(1)}" fill="transparent" style="cursor:text"/>`
        : '';
      if (interactive) {
        const tipAbove = y > 30;
        const tt = makeTT(xMid(i), tipAbove ? y : y + h, fmtTick(d.value), font, textColor, effectiveTheme.bg, tipAbove);
        return `<g class="ci"><g class="ci-el">${bar}${ring}</g>${labelHit}${lbl}${tt}</g>`;
      }
      return bar + ring + labelHit + lbl;
    }).join('');

    const glowAttr = glow ? ` filter="url(#${fid})"` : '';

    let axisLabelsSVG = '';
    if (xLabelLines.length) {
      const cx = (pad.left + W - pad.right) / 2;
      xLabelLines.forEach((line, i) => {
        const ly = H - 14 - (xLabelLines.length - 1 - i) * 14;
        axisLabelsSVG += `<text x="${cx.toFixed(1)}" y="${ly}" text-anchor="middle" font-size="11" font-family="${font}" fill="${textColor}">${escSVG(line)}</text>`;
      });
    }
    if (yLabelLines.length) {
      const cy = pad.top + cH / 2;
      yLabelLines.forEach((line, i) => {
        const lx = 14 + i * 14;
        axisLabelsSVG += `<text text-anchor="middle" font-size="11" font-family="${font}" fill="${textColor}" transform="translate(${lx},${cy.toFixed(1)}) rotate(-90)">${escSVG(line)}</text>`;
      });
    }

    return (filterDef ? `<defs>${filterDef}</defs>` : '') + `${grid}<g${glowAttr}>${bars}</g>${axisLabelsSVG}`;
  }

  /* Bubble chart — data rows: { x, y, size, label } */
  function renderBubbleChartInner(theme, data, chartStyle, options) {
    const W = 560, H = 300;
    const effectiveTheme = options?.bgColor ? { ...theme, bg: options.bgColor } : theme;
    const tok = chartTokens(effectiveTheme, chartStyle);
    const { gridColor, baseColor, font, c0, gridDash, glow, glowSD, axisLabels } = tok;
    const textColor = options?.labelColor || tok.textColor;

    if (!data.length) {
      return `<text x="${W/2}" y="${H/2}" text-anchor="middle" font-size="13" font-family="${font}" fill="${textColor}">Add data points to see the chart</text>`;
    }

    const xs = data.map(d => +d.x || 0);
    const ys = data.map(d => +d.y || 0);
    const sizes = data.map(d => Math.max(+d.size || 1, 0.01));

    // Compute bubble radii before pad so maxR can inform overflow padding
    const sMin = Math.min(...sizes), sMax = Math.max(...sizes);
    const sRange = sMax - sMin || 1;
    const rOf = s => 5 + ((s - sMin) / sRange) * 23;
    const maxR = Math.ceil(rOf(sMax));

    const pad = { top: 12 + maxR, right: 12 + maxR, bottom: 44, left: 54 };
    const xLabelLines = (options?.xLabel && axisLabels) ? wrapSVGText(options.xLabel, W - 100, 11, false, font) : [];
    if (xLabelLines.length) pad.bottom += 14 + xLabelLines.length * 14;
    const yLabelLines = (options?.yLabel && axisLabels) ? wrapSVGText(options.yLabel, 220, 11, false, font) : [];
    if (yLabelLines.length) pad.left = Math.max(pad.left, 54 + (yLabelLines.length - 1) * 14);

    // Build scales — respect custom min/max from options
    const hasXMin = options?.xMin !== '' && options?.xMin !== undefined && !isNaN(+options.xMin);
    const hasXMax = options?.xMax !== '' && options?.xMax !== undefined && !isNaN(+options.xMax);
    const hasYMin = options?.yMin !== '' && options?.yMin !== undefined && !isNaN(+options.yMin);
    const hasYMax = options?.yMax !== '' && options?.yMax !== undefined && !isNaN(+options.yMax);

    const xDataMin = Math.min(...xs), xDataMax = Math.max(...xs);
    const yDataMin = Math.min(...ys), yDataMax = Math.max(...ys);
    const xPad = (xDataMax - xDataMin || 1) * 0.12;
    const yPad = (yDataMax - yDataMin || 1) * 0.15;

    const xMinS = hasXMin ? +options.xMin : xDataMin - xPad;
    const xMaxS = hasXMax ? +options.xMax : xDataMax + xPad;
    const yMinS = hasYMin ? +options.yMin : yDataMin - yPad;
    const yMaxS = hasYMax ? +options.yMax : yDataMax + yPad;

    const cW = W - pad.left - pad.right;
    const cH = H - pad.top - pad.bottom;
    const scX = x => pad.left + ((x - xMinS) / (xMaxS - xMinS)) * cW;
    const scY = y => pad.top + cH - ((y - yMinS) / (yMaxS - yMinS)) * cH;

    const dash = gridDash ? ` stroke-dasharray="${gridDash}"` : '';

    // Axis ticks
    const { ticks: xTicks } = customScale(xMinS, xMaxS, 4);
    const { ticks: yTicks } = customScale(yMinS, yMaxS, 4);

    const grid =
      yTicks.map(t => {
        const y = scY(t).toFixed(1);
        const lbl = axisLabels ? `<text x="${pad.left - 8}" y="${(+y + 4).toFixed(1)}" text-anchor="end" font-size="11" font-family="${font}" fill="${textColor}">${fmtTick(t)}</text>` : '';
        return `<line x1="${pad.left}" y1="${y}" x2="${W - pad.right}" y2="${y}" stroke="${t === 0 ? baseColor : gridColor}" stroke-width="1"${dash}/>${lbl}`;
      }).join('') +
      xTicks.map(t => {
        const x = scX(t).toFixed(1);
        const lbl = axisLabels ? `<text x="${x}" y="${(pad.top + cH + 16).toFixed(1)}" text-anchor="middle" font-size="11" font-family="${font}" fill="${textColor}">${fmtTick(t)}</text>` : '';
        return `<line x1="${x}" y1="${pad.top}" x2="${x}" y2="${(pad.top + cH).toFixed(1)}" stroke="${t === 0 ? baseColor : gridColor}" stroke-width="1"${dash}/>${lbl}`;
      }).join('');

    const fid = glow ? 'bbl' + Math.random().toString(36).slice(2, 6) : '';
    const filterDef = glow ? `<filter id="${fid}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceGraphic" stdDeviation="${glowSD}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>` : '';

    const interactive = options?.interactive || false;
    const bubbles = data.map((d, i) => {
      const cx = scX(+d.x || 0), cy = scY(+d.y || 0);
      const r  = rOf(Math.max(+d.size || 1, 0.01));
      const fill = options?.barColors?.[i] || c0;
      const isSelected = options?.selectedBar === i;

      const circle = `<circle data-bar-idx="${i}" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="${fill}" fill-opacity="0.72" stroke="${fill}" stroke-width="1.5"/>`;
      const ring   = isSelected ? `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(r+4).toFixed(1)}" fill="none" stroke="${fill}" stroke-width="2" opacity="0.45"/>` : '';
      const labelAboveY = cy - r - 5;
      const below = labelAboveY < pad.top + 10;
      const lblY  = below ? cy + r + 14 : labelAboveY;
      const rectY = below ? cy + r + 3  : cy - r - 16;
      const lbl    = d.label
        ? `<text data-editable="bubble-label-${i}" x="${cx.toFixed(1)}" y="${lblY.toFixed(1)}" text-anchor="middle" font-size="10" font-family="${font}" fill="${textColor}">${escSVG(d.label)}</text>`
        : `<rect data-editable="bubble-label-${i}" x="${(cx - 22).toFixed(1)}" y="${rectY.toFixed(1)}" width="44" height="13" fill="transparent" style="cursor:text"/>`;

      if (interactive) {
        const ttText = (d.label ? d.label + ': ' : '') + fmtTick(d.size);
        const tt = makeTT(cx, cy - r, ttText, font, textColor, effectiveTheme.bg, true);
        return `<g class="ci"><g class="ci-el">${circle}${ring}</g>${lbl}${tt}</g>`;

    const glowAttr = glow ? ` filter="url(#${fid})"` : '';

    let axisLabelsSVG = '';
    if (xLabelLines.length) {
      const cx = (pad.left + cW / 2).toFixed(1);
      xLabelLines.forEach((line, i) => {
        const ly = H - 14 - (xLabelLines.length - 1 - i) * 14;
        axisLabelsSVG += `<text x="${cx}" y="${ly}" text-anchor="middle" font-size="11" font-family="${font}" fill="${textColor}">${escSVG(line)}</text>`;
      });
    }
    if (yLabelLines.length) {
      const cy = pad.top + cH / 2;
      yLabelLines.forEach((line, i) => {
        const lx = 14 + i * 14;

      });
    }

    return (filterDef ? `<defs>${filterDef}</defs>` : '') + `${grid}<g${glowAttr}>${bubbles}</g>${axisLabelsSVG}`;
  }

  function renderLollipopChartInner(theme, data, chartStyle, options) {

    const interactive = options?.interactive || false;

      const stem = `<line x1="${cx.toFixed(1)}" y1="${yBase.toFixed(1)}" x2="${cx.toFixed(1)}" y2="${(cy + dotR).toFixed(1)}" stroke="${fill}" stroke-width="2"/>`;
      const dot  = `<circle data-bar-idx="${i}" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${dotR}" fill="${fill}"/>`;
      const ring = isSelected
        ? `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${dotR + 3}" fill="none" stroke="${fill}" stroke-width="2" opacity="0.5"/>`
        : '';
      const lbl = wrappedLabels[i].map((line, li) =>
        `<text data-editable="bar-label-${i}" x="${cx.toFixed(1)}" y="${(yBase + 16 + li * 13).toFixed(1)}" text-anchor="middle" font-size="11" font-family="${font}" fill="${textColor}">${escSVG(line)}</text>`
      ).join('');
      const labelHit = axisLabels
        ? `<rect data-editable="bar-label-${i}" x="${(cx - slot / 2 + 2).toFixed(1)}" y="${(yBase + 4).toFixed(1)}" width="${(slot - 4).toFixed(1)}" height="${(pad.bottom - 8).toFixed(1)}" fill="transparent" style="cursor:text"/>`

  function renderDotPlotInner(theme, data, chartStyle, options) {
    const W = 560, H = 300;
    const pad = { top: 12, right: 20, bottom: 36, left: 50 };
    const effectiveTheme = options?.bgColor ? { ...theme, bg: options.bgColor } : theme;
    const tok = chartTokens(effectiveTheme, chartStyle);
    const { gridColor, baseColor, font, c0, glow, glowSD, axisLabels, gridDash } = tok;
    const textColor = options?.labelColor || tok.textColor;
    const dotR = 6;

    // X scale
    const dataMax = Math.max(...data.map(d => d.value), 1);
    const xMaxOpt = options?.xMax !== '' && options?.xMax !== undefined && !isNaN(+options.xMax) ? +options.xMax : null;
    const xMinOpt = options?.xMin !== '' && options?.xMin !== undefined && !isNaN(+options.xMin) ? +options.xMin : null;
    const { max: xScaleMax, ticks: xTicks } = xMaxOpt !== null ? customScale(xMinOpt ?? 0, xMaxOpt) : niceScale(dataMax);
    const xScaleMin = xMaxOpt !== null ? (xMinOpt ?? 0) : (xMinOpt !== null ? xMinOpt : 0);

    // Measure category label widths dynamically
    if (axisLabels) {
      const _can = document.createElement('canvas');
      const _ctx = _can.getContext('2d');
      _ctx.font = `11px ${font}`;
      const maxLW = Math.max(...data.map(d => _ctx.measureText(d.label).width), 0);
      pad.left = Math.max(50, Math.ceil(maxLW) + 14);
    }

    const xLabelLines = (options?.xLabel && axisLabels) ? wrapSVGText(options.xLabel, W - 100, 11, false, font) : [];
    if (xLabelLines.length) pad.bottom += 14 + xLabelLines.length * 14;
    pad.right = Math.max(pad.right, dotR + 8);

    const cH = H - pad.top - pad.bottom;
    const cW = W - pad.left - pad.right;
    const rowH = cH / data.length;
    const rowCy = i => pad.top + (i + 0.5) * rowH;
    const scX = v => pad.left + ((v - xScaleMin) / (xScaleMax - xScaleMin)) * cW;
    const yBase = pad.top + cH;
    const dash = gridDash ? ` stroke-dasharray="${gridDash}"` : '';

    // Vertical grid lines at each X tick + tick labels
    const grid = xTicks.map(t => {
      const x = scX(t).toFixed(1);
      const lbl = axisLabels
        ? `<text x="${x}" y="${(yBase + 14).toFixed(1)}" text-anchor="middle" font-size="11" font-family="${font}" fill="${textColor}">${fmtTick(t)}</text>`
        : '';
      return `<line x1="${x}" y1="${pad.top}" x2="${x}" y2="${yBase}" stroke="${t === xScaleMin ? baseColor : gridColor}" stroke-width="1"${dash}/>${lbl}`;
    }).join('');
    const xAxis = `<line x1="${pad.left}" y1="${yBase}" x2="${W - pad.right}" y2="${yBase}" stroke="${baseColor}" stroke-width="1"/>`;

    const fid = glow ? 'gf' + Math.random().toString(36).slice(2, 7) : '';
    const filterDef = glow
      ? `<filter id="${fid}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceGraphic" stdDeviation="${glowSD}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`
      : '';

    const interactive = options?.interactive || false;
    const dots = data.map((d, i) => {
      const cx = scX(d.value), cy = rowCy(i);
      const fill = options?.barColors?.[i] || c0;
      const isSelected = options?.selectedBar === i;
      const rowLine = `<line x1="${pad.left}" y1="${cy.toFixed(1)}" x2="${(cx - dotR).toFixed(1)}" y2="${cy.toFixed(1)}" stroke="${gridColor}" stroke-width="1"/>`;
      const dot = `<circle data-bar-idx="${i}" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${dotR}" fill="${fill}"/>`;
      const ring = isSelected
        ? `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${dotR + 3}" fill="none" stroke="${fill}" stroke-width="2" opacity="0.5"/>`
        : '';
      const labelText = axisLabels
        ? `<text data-editable="bar-label-${i}" x="${(pad.left - 8).toFixed(1)}" y="${(cy + 4).toFixed(1)}" text-anchor="end" font-size="11" font-family="${font}" fill="${textColor}">${escSVG(d.label)}</text>`
        : '';
      const labelHit = axisLabels
        ? `<rect data-editable="bar-label-${i}" x="0" y="${(cy - rowH / 2).toFixed(1)}" width="${(pad.left - 4).toFixed(1)}" height="${rowH.toFixed(1)}" fill="transparent" style="cursor:text"/>`
        : '';
      if (interactive) {
        const ttText = (d.label ? d.label + ': ' : '') + fmtTick(d.value);
        const tt = makeTT(cx, cy, ttText, font, textColor, effectiveTheme.bg, cy > 30);
        return `<g class="ci"><g class="ci-el">${dot}${ring}</g>${rowLine}${labelHit}${labelText}${tt}</g>`;
      }
      return rowLine + dot + ring + labelHit + labelText;
    }).join('');

    const glowAttr = glow ? ` filter="url(#${fid})"` : '';
    let axisLabelsSVG = '';
    if (xLabelLines.length) {
      const cx = (pad.left + W - pad.right) / 2;
      xLabelLines.forEach((line, i) => {
        const ly = H - 14 - (xLabelLines.length - 1 - i) * 14;
        axisLabelsSVG += `<text x="${cx.toFixed(1)}" y="${ly}" text-anchor="middle" font-size="11" font-family="${font}" fill="${textColor}">${escSVG(line)}</text>`;
      });
    }

    return (filterDef ? `<defs>${filterDef}</defs>` : '') + `${xAxis}${grid}<g${glowAttr}>${dots}</g>${axisLabelsSVG}`;

  /* variant: 'line' | 'area' | 'step' */
  function renderLineChartInner(theme, data, chartStyle, options, variant = 'line') {
    const W = 560, H = 300;
    const pad = { top: 16, right: 16, bottom: 40, left: 50 };
    const effectiveTheme = options?.bgColor ? { ...theme, bg: options.bgColor } : theme;
    const tok = chartTokens(effectiveTheme, chartStyle);
    const { gridColor, baseColor, font, c0, glow, glowSD, axisLabels, gridDash } = tok;
    const textColor = options?.labelColor || tok.textColor;

    const dataMax = Math.max(...data.map(d => d.value), 1);
    const yMaxOpt = options?.yMax !== '' && options?.yMax !== undefined && !isNaN(+options.yMax) ? +options.yMax : null;
    const yMinOpt = options?.yMin !== '' && options?.yMin !== undefined && !isNaN(+options.yMin) ? +options.yMin : 0;
    const { max, ticks } = yMaxOpt !== null ? customScale(yMinOpt, yMaxOpt) : niceScale(dataMax);
    const scaleMin = yMaxOpt !== null ? yMinOpt : 0;

    const cW = W - pad.left - pad.right;
    const slot = cW / data.length;

    // Pre-wrap x-axis category labels to set pad.bottom
    const labelMaxW = Math.max(slot - 4, 20);
    const wrappedLabels = data.map(d =>
      axisLabels ? wrapSVGText(d.label, labelMaxW, 11, false, font) : []
    );
    const maxLabelLines = Math.max(...wrappedLabels.map(ls => ls.length), 1);
    pad.bottom = Math.max(40, 24 + maxLabelLines * 13);
    const xLabelLines = (options?.xLabel && axisLabels) ? wrapSVGText(options.xLabel, W - 100, 11, false, font) : [];
    if (xLabelLines.length) pad.bottom += 14 + xLabelLines.length * 14;
    const yLabelLines = (options?.yLabel && axisLabels) ? wrapSVGText(options.yLabel, 220, 11, false, font) : [];
    if (yLabelLines.length) pad.left = Math.max(pad.left, 54 + (yLabelLines.length - 1) * 14);

    const cH = H - pad.top - pad.bottom;
    const xMid = i => pad.left + slot * i + slot / 2;
    const yV = v => pad.top + cH - ((v - scaleMin) / (max - scaleMin)) * cH;
    const yBase = pad.top + cH;
    const dash = gridDash ? ` stroke-dasharray="${gridDash}"` : '';

    // Horizontal grid lines + Y tick labels
    const grid = ticks.map(t => {
      const y = yV(t).toFixed(1);
      const lbl = axisLabels
        ? `<text x="${pad.left - 8}" y="${(+y + 4).toFixed(1)}" text-anchor="end" font-size="11" font-family="${font}" fill="${textColor}">${fmtTick(t)}</text>`
        : '';
      return `<line x1="${pad.left}" y1="${y}" x2="${W - pad.right}" y2="${y}" stroke="${t === scaleMin ? baseColor : gridColor}" stroke-width="1"${dash}/>${lbl}`;
    }).join('');

    // X axis category labels
    const xLabels = wrappedLabels.map((lines, i) =>
      lines.map((line, li) =>
        `<text x="${xMid(i).toFixed(1)}" y="${(yBase + 16 + li * 13).toFixed(1)}" text-anchor="middle" font-size="11" font-family="${font}" fill="${textColor}">${escSVG(line)}</text>`
      ).join('')
    ).join('');

    const lineColor = options?.barColors?.[0] || c0;
    const pts = data.map((d, i) => ({ x: xMid(i), y: yV(d.value) }));

    // Build the main path
    let pathD;
    if (variant === 'step') {
      pathD = `M ${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
      for (let i = 1; i < pts.length; i++) {
        pathD += ` H ${pts[i].x.toFixed(1)} V ${pts[i].y.toFixed(1)}`;
      }
    } else {
      pathD = `M ${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)} ` +
        pts.slice(1).map(p => `L ${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    }

    const fid = glow ? 'gf' + Math.random().toString(36).slice(2, 7) : '';
    const filterDef = glow
      ? `<filter id="${fid}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceGraphic" stdDeviation="${glowSD}" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`
      : '';
    const glowAttr = glow ? ` filter="url(#${fid})"` : '';

    // Area fill (closed path down to baseline)
    let areaEl = '';
    if (variant === 'area') {
      const lastX = pts[pts.length - 1].x.toFixed(1);
      const firstX = pts[0].x.toFixed(1);
      const areaD = `${pathD} L ${lastX},${yBase.toFixed(1)} L ${firstX},${yBase.toFixed(1)} Z`;
      areaEl = `<path d="${areaD}" fill="${lineColor}" fill-opacity="0.15" stroke="none"/>`;
    }

    const lineEl = `<path d="${pathD}" fill="none" stroke="${lineColor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"${glowAttr}/>`;

    // Dots at each data point
    const interactive = options?.interactive || false;
    const dotsEl = pts.map((p, i) => {
      const dot = `<circle data-bar-idx="${i}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="${lineColor}" stroke="${effectiveTheme.bg}" stroke-width="1.5"/>`;
      if (interactive) {
        const d = data[i];
        const label = d.label || d.date || '';
        const ttText = (label ? label + ': ' : '') + fmtTick(d.value);
        const tt = makeTT(p.x, p.y, ttText, font, textColor, effectiveTheme.bg, p.y > 30);
        return `<g class="ci"><g class="ci-el">${dot}</g>${tt}</g>`;
      }
      return dot;
    }).join('');

    let axisLabelsSVG = '';
    if (xLabelLines.length) {
      const cx = (pad.left + W - pad.right) / 2;
      xLabelLines.forEach((line, i) => {
        const ly = H - 14 - (xLabelLines.length - 1 - i) * 14;
        axisLabelsSVG += `<text x="${cx.toFixed(1)}" y="${ly}" text-anchor="middle" font-size="11" font-family="${font}" fill="${textColor}">${escSVG(line)}</text>`;
      });
    }
    if (yLabelLines.length) {
      const cy = pad.top + cH / 2;
      yLabelLines.forEach((line, i) => {
        const lx = 14 + i * 14;
        axisLabelsSVG += `<text text-anchor="middle" font-size="11" font-family="${font}" fill="${textColor}" transform="translate(${lx},${cy.toFixed(1)}) rotate(-90)">${escSVG(line)}</text>`;
      });
    }

    return (filterDef ? `<defs>${filterDef}</defs>` : '') + `${grid}${xLabels}${areaEl}${lineEl}${dotsEl}${axisLabelsSVG}`;
  }

  /* variant: 'pie' | 'donut' */
