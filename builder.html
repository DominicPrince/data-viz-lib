<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bar Chart Builder — data-viz-lib</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="builder-page">

  <header class="builder-header">
    <a href="index.html" class="builder-back">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Library
    </a>
    <span class="builder-header-title">Bar Chart Builder</span>
    <span></span>
  </header>

  <div class="builder-layout">

    <!-- ── Config panel ──────────────────────────────────── -->
    <aside class="builder-config">

      <div class="config-section">
        <div class="config-section-header">Data</div>
        <div id="builder-data-display"></div>
      </div>

      <div class="config-section">
        <div class="config-section-header">Metadata</div>
        <div class="config-field">
          <label>Title</label>
          <textarea id="b-title" placeholder="Chart title" rows="1"></textarea>
        </div>
        <div class="config-field">
          <label>Subtitle</label>
          <textarea id="b-subtitle" placeholder="A brief description" rows="1"></textarea>
        </div>
        <div class="config-field">
          <label>Source</label>
          <textarea id="b-source" placeholder="Data: Source name, 2024" rows="1"></textarea>
        </div>
        <div class="config-field">
          <label>Logo</label>
          <label class="logo-upload-btn" for="b-logo-input">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M7 9V3M4.5 5.5L7 3l2.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 11v.5a.5.5 0 00.5.5h9a.5.5 0 00.5-.5V11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            Upload PNG
          </label>
          <input type="file" id="b-logo-input" accept="image/*" hidden />
          <span class="b-logo-name" id="b-logo-name" hidden></span>
        </div>
        <div class="config-field">
          <label>Logo size <span class="config-field-value" id="b-logosize-val">12px</span></label>
          <input type="range" class="config-range" id="b-logosize" min="5" max="64" step="1" value="12" />
        </div>
      </div>

      <div class="config-section">
        <div class="config-section-header">Axes</div>
        <div class="config-field">
          <label>X-axis label</label>
          <input type="text" class="axis-label-input" id="b-xlabel" placeholder="Category" />
        </div>
        <div class="config-field">
          <label>Y-axis label</label>
          <input type="text" class="axis-label-input" id="b-ylabel" placeholder="Value" />
        </div>
        <div class="config-field">
          <label>Y-axis range</label>
          <div class="axis-range-row">
            <input type="number" class="axis-range-input" id="b-ymin" placeholder="Auto" />
            <span class="axis-range-sep">–</span>
            <input type="number" class="axis-range-input" id="b-ymax" placeholder="Auto" />
          </div>
        </div>
      </div>

      <div class="config-section">
        <div class="config-section-header">Appearance</div>
        <div class="config-field">
          <label>Theme</label>
          <select id="b-theme">
            <option value="default">Default</option>
            <option value="bold">Bold</option>
            <option value="earth">Earth</option>
            <option value="dark">Dark</option>
            <option value="journeys">Journeys</option>
          </select>
        </div>
        <div class="config-field">
          <label>Style</label>
          <select id="b-style">
            <option value="modern">Modern</option>
            <option value="minimal">Minimal</option>
            <option value="classic">Classic</option>
            <option value="neon">Neon</option>
            <option value="editorial">Editorial</option>
            <option value="journeys">Journeys</option>
          </select>
        </div>
        <div class="config-field">
          <label>Background colour</label>
          <div class="b-color-row">
            <input type="color" class="b-color-picker" id="b-bgcolor" value="#ffffff" />
            <span class="b-color-hex" id="b-bgcolor-hex">#ffffff</span>
            <button class="b-color-auto is-auto" id="b-bgcolor-auto">Auto</button>
          </div>
        </div>
        <div class="config-field">
          <label>Font colour</label>
          <div class="b-color-row">
            <input type="color" class="b-color-picker" id="b-fontcolor" value="#1a1816" />
            <span class="b-color-hex" id="b-fontcolor-hex">#1a1816</span>
            <button class="b-color-auto is-auto" id="b-fontcolor-auto">Auto</button>
          </div>
        </div>
      </div>

      <div class="config-section">
        <div class="config-section-header">Export</div>
        <div class="export-btns">
          <button class="export-btn" id="b-copy-svg">Copy SVG</button>
          <button class="export-btn" id="b-dl-svg">Download SVG</button>
          <button class="export-btn" id="b-dl-png">Download PNG</button>
          <button class="export-btn" id="b-copy-embed">Copy Embed</button>
        </div>
        <div class="export-feedback" id="export-feedback"></div>
      </div>

    </aside>

    <!-- ── Live preview ───────────────────────────────────── -->
    <div class="builder-preview">
      <div class="builder-preview-inner" id="builder-preview"></div>
    </div>

  </div>

  <!-- ── Data edit modal ────────────────────────────────── -->
  <div id="data-edit-modal" hidden>
    <div class="data-modal-backdrop" onclick="closeDataModal()"></div>
    <div class="data-modal-panel">
      <div class="data-modal-header">
        <span class="data-modal-title">Edit data</span>
        <button class="data-modal-close" onclick="closeDataModal()" aria-label="Close">×</button>
      </div>

      <div class="dm-input-tabs">
        <button class="dm-tab active" data-input="manual">Manual</button>
        <button class="dm-tab" data-input="paste">Paste CSV</button>
        <button class="dm-tab" data-input="upload">Upload</button>
      </div>

      <div class="dm-input-panel" id="dm-input-manual">
        <table class="manual-table" id="dm-manual-table">
          <thead><tr><th>Label</th><th>Value</th><th></th></tr></thead>
          <tbody id="dm-manual-tbody"></tbody>
        </table>
        <button class="add-row-btn" id="dm-add-row-btn">+ Add row</button>
      </div>

      <div class="dm-input-panel" id="dm-input-paste" hidden>
        <textarea id="dm-csv-paste" placeholder="Label,Value&#10;Apples,85&#10;Oranges,62&#10;Bananas,108"></textarea>
      </div>

      <div class="dm-input-panel" id="dm-input-upload" hidden>
        <label class="file-upload-area" id="dm-upload-label">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M12 16V8M9 11l3-3 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span>Drop a CSV file here, or click to browse</span>
          <input type="file" id="dm-file-input" accept=".csv" hidden>
        </label>
        <p class="upload-filename" id="dm-upload-filename" hidden></p>
      </div>

      <div class="data-modal-footer">
        <button class="build-cta-btn" id="dm-done-btn">Done</button>
      </div>
    </div>
  </div>

  <script>
  /* ─────────────────────────────────────────────────────────
     Self-contained helpers (copied from app.js)
  ───────────────────────────────────────────────────────── */

  const PRESETS = {
    default:  { bg:'#ffffff', palette:['#3B82F6','#10B981','#F59E0B','#EF4444','#8B5CF6','#EC4899'], font:'Inter' },
    bold:     { bg:'#fff7f7', palette:['#EF4444','#F97316','#FBBF24','#84CC16','#06B6D4','#8B5CF6'], font:'Inter' },
    earth:    { bg:'#faf7f2', palette:['#92400E','#B45309','#D97706','#65A30D','#047857','#6B7280'], font:"'Georgia', serif" },
    dark:     { bg:'#111111', palette:['#CCCCCC','#999999','#666666','#444444','#EEEEEE','#222222'], font:'Inter' },
    journeys: { bg:'#F0F7FC', palette:['#29ABE2','#26C6A0','#F44336','#E91E8C','#7B3FC4','#5C2D91'], font:"'Inter', sans-serif" },
  };

  const CHART_STYLES = {
    modern:    { barRadius:5,  gridScale:1,  gridDash:'',    strokeW:2.5, fontOverride:null,                         glow:false, axisLabels:true  },
    minimal:   { barRadius:2,  gridScale:0,  gridDash:'',    strokeW:1.5, fontOverride:null,                         glow:false, axisLabels:false },
    classic:   { barRadius:0,  gridScale:3,  gridDash:'',    strokeW:1.5, fontOverride:'Georgia, serif',             glow:false, axisLabels:true  },
    neon:      { barRadius:1,  gridScale:1,  gridDash:'3 3', strokeW:2,   fontOverride:'"Courier New", monospace',   glow:true,  axisLabels:true  },
    editorial: { barRadius:0,  gridScale:5,  gridDash:'',    strokeW:3,   fontOverride:null,                         glow:false, axisLabels:true  },
    journeys:  { barRadius:12, gridScale:0,  gridDash:'',    strokeW:2.5, fontOverride:"'Inter', sans-serif",        glow:false, axisLabels:true  },
  };

  function isColorDark(hex) {
    const c = hex.replace('#','');
    if (c.length < 6) return false;
    const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    return (0.299*r + 0.587*g + 0.114*b) < 128;
  }

  function niceScale(maxVal, tickCount = 4) {
    const rawStep = (maxVal * 1.2) / tickCount;
    const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const norm = rawStep / mag;
    const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
    const max = Math.ceil((maxVal * 1.2) / step) * step;
    const ticks = [];
    for (let v = 0; v <= max + step * 0.001; v += step) ticks.push(Math.round(v));
    return { max, ticks };
  }

  function customScale(min, max, tickCount = 4) {
    const range = (max - min) || 1;
    const step = range / tickCount;
    const ticks = [];
    for (let i = 0; i <= tickCount; i++) {
      ticks.push(parseFloat((min + i * step).toPrecision(6)));
    }
    return { max, ticks };
  }

  function fmtTick(v) {
    if (v >= 1e6) return (v / 1e6) + 'M';
    if (v >= 1e3) return (v / 1e3) + 'K';
    return String(v);
  }

  function chartTokens(theme, chartStyle) {
    const dark = isColorDark(theme.bg);
    const sty = CHART_STYLES[chartStyle] || CHART_STYLES.modern;
    const ch = dark ? '255,255,255' : '0,0,0';
    const gridOpacity = Math.min(0.9, (dark ? 0.06 : 0.05) * sty.gridScale).toFixed(3);
    return {
      textColor:  dark ? 'rgba(255,255,255,0.4)'  : 'rgba(0,0,0,0.32)',
      gridColor:  `rgba(${ch},${gridOpacity})`,
      baseColor:  dark ? 'rgba(255,255,255,0.14)' : 'rgba(0,0,0,0.10)',
      font:       sty.fontOverride || ((theme.font || 'Inter') + ', sans-serif'),
      c0:         theme.palette[0],
      barRadius:  sty.barRadius,
      gridDash:   sty.gridDash,
      glow:       sty.glow,
      axisLabels: sty.axisLabels,
    };
  }

  /* Returns inner SVG content only (no wrapping <svg> or background rect) */
  function renderBarChartInner(theme, data, chartStyle, options) {
    const W = 560, H = 300;
    const pad = { top: 16, right: 16, bottom: 40, left: 50 };
    const cW = W - pad.left - pad.right;
    const effectiveTheme = options?.bgColor ? { ...theme, bg: options.bgColor } : theme;
    const tok = chartTokens(effectiveTheme, chartStyle);
    const { gridColor, baseColor, font, c0, barRadius, gridDash, glow, axisLabels } = tok;
    const textColor = options?.fontColor || tok.textColor;

    // Scale — respect custom yMin/yMax if provided
    const dataMax = Math.max(...data.map(d => d.v), 1); // floor of 1 avoids division-by-zero on all-zero data
    const yMaxOpt = options?.yMax !== '' && options?.yMax !== undefined && !isNaN(+options.yMax) ? +options.yMax : null;
    const yMinOpt = options?.yMin !== '' && options?.yMin !== undefined && !isNaN(+options.yMin) ? +options.yMin : 0;
    const { max, ticks } = yMaxOpt !== null ? customScale(yMinOpt, yMaxOpt) : niceScale(dataMax);
    const scaleMin = yMaxOpt !== null ? yMinOpt : 0;

    const slot = cW / data.length;
    const bW = Math.round(slot * 0.52);

    // Pre-compute wrapped labels so we can dynamically size pad.bottom
    const labelMaxW = Math.max(slot - 8, 20);
    const wrappedLabels = data.map(d =>
      axisLabels ? wrapSVGText(d.l, labelMaxW, 11, false, font).slice(0, 3) : []
    );
    const maxLabelLines = Math.max(...wrappedLabels.map(ls => ls.length), 1);
    pad.bottom = Math.max(40, 24 + maxLabelLines * 13);

    const cH = H - pad.top - pad.bottom;
    const xMid = i => pad.left + slot * i + slot / 2;
    const yV   = v => pad.top + cH - ((v - scaleMin) / (max - scaleMin)) * cH;
    const yBase = pad.top + cH;
    const r = barRadius;
    const dash = gridDash ? ` stroke-dasharray="${gridDash}"` : '';

    const grid = ticks.map(t => {
      const y = yV(t).toFixed(1);
      const lbl = axisLabels
        ? `<text x="${pad.left - 8}" y="${(+y + 4).toFixed(1)}" text-anchor="end" font-size="11" font-family="${font}" fill="${textColor}">${fmtTick(t)}</text>`
        : '';
      return `<line x1="${pad.left}" y1="${y}" x2="${W - pad.right}" y2="${y}" stroke="${t === scaleMin ? baseColor : gridColor}" stroke-width="1"${dash}/>${lbl}`;
    }).join('');

    const fid = glow ? 'gf' + Math.random().toString(36).slice(2, 7) : '';
    const filterDef = glow
      ? `<filter id="${fid}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`
      : '';

    const bars = data.map((d, i) => {
      const x = xMid(i) - bW / 2, y = yV(d.v), h = yBase - y;
      const fill = options?.barColors?.[i] || c0;
      const isSelected = options?.selectedBar === i;
      const bar = r === 0 || h <= r
        ? `<rect data-bar-idx="${i}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bW}" height="${h.toFixed(1)}" fill="${fill}"/>`
        : `<path data-bar-idx="${i}" d="M${x.toFixed(1)},${(y+h).toFixed(1)} L${x.toFixed(1)},${(y+r).toFixed(1)} Q${x.toFixed(1)},${y.toFixed(1)} ${(x+r).toFixed(1)},${y.toFixed(1)} L${(x+bW-r).toFixed(1)},${y.toFixed(1)} Q${(x+bW).toFixed(1)},${y.toFixed(1)} ${(x+bW).toFixed(1)},${(y+r).toFixed(1)} L${(x+bW).toFixed(1)},${(y+h).toFixed(1)} Z" fill="${fill}"/>`;
      const ring = isSelected
        ? `<rect x="${(x-2.5).toFixed(1)}" y="${(y-2.5).toFixed(1)}" width="${(bW+5).toFixed(1)}" height="${(h+5).toFixed(1)}" fill="none" stroke="${fill}" stroke-width="2" opacity="0.5" rx="${r > 0 ? r + 2 : 0}"/>`
        : '';
      const lbl = wrappedLabels[i].map((line, li) =>
        `<text data-editable="bar-label-${i}" x="${xMid(i).toFixed(1)}" y="${(pad.top + cH + 16 + li * 13).toFixed(1)}" text-anchor="middle" font-size="11" font-family="${font}" fill="${textColor}">${escSVG(line)}</text>`
      ).join('');
      // Invisible hit-area keeps the label zone clickable even when the label is empty
      const labelHit = axisLabels
        ? `<rect data-editable="bar-label-${i}" x="${(xMid(i) - slot / 2 + 2).toFixed(1)}" y="${(pad.top + cH + 4).toFixed(1)}" width="${(slot - 4).toFixed(1)}" height="${(pad.bottom - 8).toFixed(1)}" fill="transparent" style="cursor:text"/>`
        : '';
      return bar + ring + labelHit + lbl;
    }).join('');

    const glowAttr = glow ? ` filter="url(#${fid})"` : '';

    let axisLabelsSVG = '';
    if (options?.xLabel) {
      const cx = (pad.left + W - pad.right) / 2;
      axisLabelsSVG += `<text x="${cx.toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11" font-family="${font}" fill="${textColor}">${escSVG(options.xLabel)}</text>`;
    }
    if (options?.yLabel) {
      const cy = pad.top + cH / 2;
      axisLabelsSVG += `<text text-anchor="middle" font-size="11" font-family="${font}" fill="${textColor}" transform="translate(12,${cy.toFixed(1)}) rotate(-90)">${escSVG(options.yLabel)}</text>`;
    }

    return (filterDef ? `<defs>${filterDef}</defs>` : '') + `${grid}<g${glowAttr}>${bars}</g>${axisLabelsSVG}`;
  }

  function escSVG(str) {
    return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function escAttr(str) {
    return (str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function hexToRgba(hex, alpha) {
    const c = hex.replace('#', '');
    return `rgba(${parseInt(c.substr(0,2),16)},${parseInt(c.substr(2,2),16)},${parseInt(c.substr(4,2),16)},${alpha})`;
  }

  /* Canvas-based text measurement for SVG word-wrap */
  const _wrapCanvas = document.createElement('canvas');
  const _wrapCtx = _wrapCanvas.getContext('2d');

  function wrapSVGText(text, maxWidth, fontSize, isBold, fontFamily) {
    if (!text) return [];
    // Use primary font name for measurement (strips quotes and fallbacks)
    const primary = fontFamily.split(',')[0].replace(/['"]/g, '').trim();
    _wrapCtx.font = `${isBold ? '700 ' : ''}${fontSize}px ${primary}`;
    // Split on hard line-breaks first, then word-wrap each paragraph
    const lines = [];
    for (const para of text.split('\n')) {
      const words = para.split(' ');
      let line = '';
      for (const word of words) {
        const test = line ? line + ' ' + word : word;
        if (_wrapCtx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = word;
        } else {
          line = test;
        }
      }
      lines.push(line); // preserve hard breaks (empty string = blank line)
    }
    if (lines.length && lines[lines.length - 1] === '') lines.pop();
    return lines;
  }

  /* Wraps chart inner content with title / subtitle / source / logo */
  function composeSVG(innerContent, state) {
    const W = 560, chartH = 300;
    const { theme, options, chartStyle } = state;
    const { title, subtitle, source, logoDataUrl } = options;
    const bg = options?.bgColor || theme.bg;

    const tok = chartTokens({ ...theme, bg }, chartStyle);
    const font = tok.font;
    const maxTextW = W - 48; // 24px padding each side

    // Wrap both text fields; line heights: title=22px, subtitle=18px
    const titleLines    = wrapSVGText(title,    maxTextW, 18, true,  font);
    const subtitleLines = wrapSVGText(subtitle, maxTextW, 13, false, font);

    // topPad: 40px base for first title line + 22px per extra; 24px base for subtitle + 18px per extra
    let topPad = 0, bottomPad = 0;
    if (titleLines.length)     topPad += 40 + (titleLines.length    - 1) * 22;
    if (subtitleLines.length)  topPad += 24 + (subtitleLines.length - 1) * 18;
    const logoH = options?.logoSize || 12;
    if (source)     bottomPad = Math.max(bottomPad, 40);
    if (logoDataUrl) bottomPad = Math.max(bottomPad, logoH + 16);

    const totalH = chartH + topPad + bottomPad;
    const dark = isColorDark(bg);
    const textColor  = options?.fontColor || (dark ? 'rgba(255,255,255,0.85)' : '#1A1816');
    const mutedColor = options?.fontColor
      ? hexToRgba(options.fontColor, 0.6)
      : (dark ? 'rgba(255,255,255,0.45)' : '#767676');

    let out = `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 ${W} ${totalH}">`;
    out += `<rect width="${W}" height="${totalH}" fill="${bg}"/>`;

    let ty = 0;
    titleLines.forEach((ln, i) => {
      out += `<text data-editable="title" x="24" y="${ty + 30 + i * 22}" font-size="18" font-weight="700" font-family="${font}" fill="${textColor}">${escSVG(ln)}</text>`;
    });
    if (titleLines.length) ty += 40 + (titleLines.length - 1) * 22;

    subtitleLines.forEach((ln, i) => {
      out += `<text data-editable="subtitle" x="24" y="${ty + 16 + i * 18}" font-size="13" font-family="${font}" fill="${mutedColor}">${escSVG(ln)}</text>`;
    });

    out += `<g transform="translate(0,${topPad})">${innerContent}</g>`;

    if (source) {
      out += `<text data-editable="source" x="24" y="${topPad + chartH + 28}" font-size="11" font-family="${font}" fill="${mutedColor}">${escSVG('Source: ' + source)}</text>`;
    }
    if (logoDataUrl) {
      // Vertically centre logo within footer area; right-align via preserveAspectRatio
      const logoY = topPad + chartH + Math.floor((bottomPad - logoH) / 2);
      out += `<image data-editable="logo" style="cursor:pointer" href="${logoDataUrl}" x="24" y="${logoY}" width="${W - 48}" height="${logoH}" preserveAspectRatio="xMaxYMid meet"/>`;
    }

    out += '</svg>';
    return out;
  }

  /* ─────────────────────────────────────────────────────────
     Builder state
  ───────────────────────────────────────────────────────── */

  const saved = sessionStorage.getItem('builderState');
  if (!saved) { window.location.href = 'index.html'; }

  const loaded = JSON.parse(saved);
  const bState = {
    data:       loaded.data       || [],
    theme:      loaded.theme      || PRESETS.default,
    chartStyle: loaded.chartStyle || 'modern',
    options: { title: '', subtitle: '', source: '', logoDataUrl: null, xLabel: '', yLabel: '', fontColor: '', bgColor: '', logoSize: 12, barColors: [], selectedBar: -1, yMin: '', yMax: '' },
  };

  let currentSVG = '';
  let _editActive = false; // suppresses rerender while an inline edit is open

  function rerender() {
    if (_editActive) return;
    const inner = renderBarChartInner(bState.theme, bState.data, bState.chartStyle, bState.options);
    currentSVG = composeSVG(inner, bState);
    document.getElementById('builder-preview').innerHTML = currentSVG;
  }

  function selectBar(i, openPicker) {
    bState.options.selectedBar = i;
    rerender();
    document.querySelectorAll('.data-row').forEach(r => r.classList.remove('is-selected'));
    const row = document.getElementById('data-row-' + i);
    if (row) {
      row.classList.add('is-selected');
      row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      if (openPicker) {
        const input = document.getElementById('data-color-' + i);
        if (input) setTimeout(() => { try { input.showPicker(); } catch(e) { input.click(); } }, 150);
      }
    }
  }

  /* ─────────────────────────────────────────────────────────
     Init
  ───────────────────────────────────────────────────────── */

  // Match preset by bg colour (best-effort)
  const themeKey = Object.keys(PRESETS).find(k => PRESETS[k].bg === bState.theme.bg) || 'default';

  // Data section — inline editable rows with colour swatch
  function populateDataDisplay() {
    const el = document.getElementById('builder-data-display');
    const defaultColor = bState.theme.palette[0];
    const gripperSVG = `<svg class="drag-handle" viewBox="0 0 10 16" width="10" height="16" fill="currentColor" aria-hidden="true"><circle cx="3" cy="3" r="1.2"/><circle cx="7" cy="3" r="1.2"/><circle cx="3" cy="8" r="1.2"/><circle cx="7" cy="8" r="1.2"/><circle cx="3" cy="13" r="1.2"/><circle cx="7" cy="13" r="1.2"/></svg>`;
    el.innerHTML = bState.data.map((row, i) => {
      const color = bState.options.barColors[i] || defaultColor;
      const sel = bState.options.selectedBar === i ? ' is-selected' : '';
      const hasCustom = bState.options.barColors[i] != null && bState.options.barColors[i] !== '';
      return `<div class="data-row${sel}" id="data-row-${i}" data-row-idx="${i}">` +
        gripperSVG +
        `<label class="bar-color-swatch-label" for="data-color-${i}">` +
          `<input type="color" class="bar-color-input" id="data-color-${i}" data-bar-idx="${i}" value="${color}">` +
        `</label>` +
        `<button class="color-reset-btn" data-reset="${i}" title="Reset to theme colour"${hasCustom ? '' : ' style="visibility:hidden"'}>↺</button>` +
        `<input type="text" class="data-label-input" id="data-label-${i}" value="${escAttr(row.l)}" placeholder="Label">` +
        `<input type="number" class="data-value-input" id="data-val-${i}" value="${row.v}" step="any" placeholder="0">` +
        `<button class="data-del-btn" data-del="${i}" title="Remove">×</button>` +
      `</div>`;
    }).join('') +
    `<div class="data-section-footer">` +
      `<button class="add-row-btn" id="sidebar-add-row">+ Add row</button>` +
      `<button class="builder-back-link" onclick="openDataModal()">Import CSV</button>` +
    `</div>`;

    // Colour picker — updates barColors on change, selects bar on click
    el.querySelectorAll('.bar-color-input').forEach(input => {
      input.addEventListener('input', e => {
        const i = parseInt(e.target.dataset.barIdx);
        bState.options.barColors[i] = e.target.value;
        rerender();
      });
      input.addEventListener('click', e => {
        const i = parseInt(e.target.dataset.barIdx);
        if (bState.options.selectedBar !== i) selectBar(i, false);
      });
    });

    // Label input — updates data label live
    el.querySelectorAll('.data-label-input').forEach((input, i) => {
      input.addEventListener('input', e => {
        if (bState.data[i]) { bState.data[i].l = e.target.value; rerender(); }
      });
    });

    // Value input — updates data value live
    el.querySelectorAll('.data-value-input').forEach((input, i) => {
      input.addEventListener('input', e => {
        const v = parseFloat(e.target.value);
        if (!isNaN(v) && bState.data[i]) { bState.data[i].v = v; rerender(); }
      });
    });

    // Delete buttons
    el.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = parseInt(btn.dataset.del);
        bState.data.splice(i, 1);
        bState.options.barColors.splice(i, 1);
        if (bState.options.selectedBar === i) bState.options.selectedBar = -1;
        else if (bState.options.selectedBar > i) bState.options.selectedBar--;
        rerender();
        populateDataDisplay();
      });
    });

    // Add row button
    const addBtn = document.getElementById('sidebar-add-row');
    if (addBtn) {
      addBtn.addEventListener('click', () => {
        bState.data.push({ l: '', v: 0 });
        rerender();
        populateDataDisplay();
        setTimeout(() => {
          const input = document.getElementById('data-label-' + (bState.data.length - 1));
          if (input) { input.focus(); input.select(); }
        }, 30);
      });
    }

    // Reset-to-theme colour buttons
    el.querySelectorAll('.color-reset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = parseInt(btn.dataset.reset);
        bState.options.barColors[i] = undefined;
        rerender();
        populateDataDisplay();
      });
    });

    // Drag-to-reorder — mouse events for live nudge + insertion indicator
    el.style.position = 'relative';
    el.querySelectorAll('.drag-handle').forEach(handle => {
      handle.addEventListener('mousedown', e => {
        if (e.button !== 0) return;
        e.preventDefault();

        const rows    = Array.from(el.querySelectorAll('.data-row'));
        const S       = parseInt(handle.closest('.data-row').dataset.rowIdx);
        // Snapshot bounding rects before any transforms
        const oRects  = rows.map(r => r.getBoundingClientRect());
        const rowH    = oRects[0]?.height || 36;

        rows[S].classList.add('is-dragging');
        document.body.style.cursor = 'grabbing';

        const indicator = document.createElement('div');
        indicator.className = 'drag-indicator';
        indicator.style.display = 'none';
        el.appendChild(indicator);

        let T = S;

        const onMove = ev => {
          // Determine insertion index by comparing cursor Y to each row's midpoint
          let newT = rows.length;
          for (let i = 0; i < rows.length; i++) {
            if (i === S) continue;
            if (ev.clientY < oRects[i].top + oRects[i].height / 2) { newT = i; break; }
          }
          T = newT;

          // Nudge: rows between S and T slide out of the way
          rows.forEach((r, i) => {
            if (i === S) return;
            let shift = 0;
            if (T <= S) { if (i >= T && i < S) shift =  rowH; }
            else        { if (i >  S && i < T) shift = -rowH; }
            r.style.transform  = shift ? `translateY(${shift}px)` : '';
            r.style.transition = 'transform 0.12s ease';
          });

          // Insertion line — computed from original rects to avoid reflow
          if (T === S || T === S + 1) { indicator.style.display = 'none'; return; }

          let indVY;
          if (T === 0) {
            indVY = oRects[0].top;
          } else if (T === rows.length) {
            const lastSh = (rows.length - 1 > S && rows.length - 1 < T) ? -rowH : 0;
            indVY = oRects[rows.length - 1].bottom + lastSh;
          } else if (T > S) {
            const prevSh = (T - 1 > S) ? -rowH : 0;
            indVY = oRects[T - 1].bottom + prevSh;
          } else {
            indVY = oRects[T].top;
          }

          const elRect = el.getBoundingClientRect();
          indicator.style.display = 'block';
          indicator.style.top     = (indVY - elRect.top + el.scrollTop) + 'px';
        };

        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup',   onUp);
          document.body.style.cursor = '';
          rows.forEach(r => {
            r.classList.remove('is-dragging');
            r.style.transform  = '';
            r.style.transition = '';
          });
          indicator.remove();

          if (T !== S && T !== S + 1) {
            const dest = T > S ? T - 1 : T;
            const [d] = bState.data.splice(S, 1);
            bState.data.splice(dest, 0, d);
            const [c] = bState.options.barColors.splice(S, 1);
            bState.options.barColors.splice(dest, 0, c);
            if      (bState.options.selectedBar === S) bState.options.selectedBar = dest;
            else if (S < bState.options.selectedBar && dest >= bState.options.selectedBar) bState.options.selectedBar--;
            else if (S > bState.options.selectedBar && dest <= bState.options.selectedBar) bState.options.selectedBar++;
            rerender();
            populateDataDisplay();
          }
        };

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup',   onUp);
      });
    });
  }
  populateDataDisplay();

  rerender();

  // Inline SVG editing
  function startInlineEdit(svgEl, fieldKey) {
    // Only one edit at a time
    if (_editActive) return;

    const getVal = () => {
      if (fieldKey === 'title')    return bState.options.title;
      if (fieldKey === 'subtitle') return bState.options.subtitle;
      if (fieldKey === 'source')   return bState.options.source;
      if (fieldKey.startsWith('bar-label-')) {
        const idx = parseInt(fieldKey.slice(10));
        return bState.data[idx]?.l || '';
      }
      return '';
    };

    const setVal = val => {
      if (fieldKey === 'title')    { bState.options.title = val;    const e = document.getElementById('b-title');    if (e) { e.value = val; taAutoH(e); } }
      if (fieldKey === 'subtitle') { bState.options.subtitle = val; const e = document.getElementById('b-subtitle'); if (e) { e.value = val; taAutoH(e); } }
      if (fieldKey === 'source')   { bState.options.source = val;   const e = document.getElementById('b-source');   if (e) { e.value = val; taAutoH(e); } }
      if (fieldKey.startsWith('bar-label-')) {
        const idx = parseInt(fieldKey.slice(10));
        if (bState.data[idx]) bState.data[idx].l = val;
        const e = document.getElementById('data-label-' + idx);
        if (e) e.value = val;
      }
    };

    const origVal = getVal();

    // Hide all same-field SVG elements; find first text element to anchor position
    const svgRoot    = svgEl.closest('svg');
    const allSameKey = Array.from(svgRoot.querySelectorAll(`[data-editable="${fieldKey}"]`));
    allSameKey.forEach(el => el.setAttribute('visibility', 'hidden'));

    // Always open at the first text line so multi-line fields don't jump
    const posEl = allSameKey.find(el => el.tagName.toLowerCase() === 'text') || svgEl;
    const bbox  = posEl.getBBox();
    const ctm   = svgEl.getScreenCTM();
    const pt    = svgEl.ownerSVGElement.createSVGPoint();
    pt.x = bbox.x;
    pt.y = bbox.y;
    const origin = pt.matrixTransform(ctm);

    // Match SVG text appearance
    const tok         = chartTokens(bState.theme, bState.chartStyle);
    const svgFontSize = parseFloat(svgEl.getAttribute('font-size') || '11');
    const isBold      = svgEl.getAttribute('font-weight') === '700';
    const rawFill     = svgEl.getAttribute('fill') || '';
    const svgFill     = (rawFill && rawFill !== 'transparent' && rawFill !== 'none')
                          ? rawFill
                          : (bState.options.fontColor || tok.textColor);
    const bgColor     = bState.options.bgColor || bState.theme.bg;
    const inputFontSz = Math.round(svgFontSize * ctm.a);

    // Wrap at the same max-width used by the SVG renderer so the editor
    // matches the chart layout exactly for all field types
    const isBarLabel = fieldKey.startsWith('bar-label-');
    const svgMaxW    = isBarLabel ? Math.max((494 / bState.data.length) - 8, 20) : 512;
    const maxWidthPx = Math.round(svgMaxW * ctm.a);

    const editor = document.createElement('div');
    editor.contentEditable = 'true';
    editor.spellcheck = false;
    // innerHTML so \n in stored values renders as visible line breaks
    editor.innerHTML = origVal
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\n/g, '<br>');
    editor.style.cssText =
      `position:fixed;z-index:9999;` +
      `left:${origin.x - 4}px;top:${origin.y - 2}px;` +
      `display:inline-block;min-width:1ch;` +
      `white-space:normal;word-break:break-word;max-width:${maxWidthPx}px;` +
      `font:${isBold ? '700 ' : ''}${inputFontSz}px ${tok.font};` +
      `color:${svgFill};background:${bgColor};` +
      `padding:0 3px;line-height:1.4;` +
      `border:none;border-bottom:1.5px solid rgba(59,130,246,0.65);outline:none;`;

    document.body.appendChild(editor);
    _editActive = true;

    // Select all on open
    editor.focus();
    const sel = window.getSelection();
    const rng = document.createRange();
    rng.selectNodeContents(editor);
    sel.removeAllRanges();
    sel.addRange(rng);

    // Paste as plain text only
    editor.addEventListener('paste', e => {
      e.preventDefault();
      const text = e.clipboardData.getData('text/plain');
      document.execCommand('insertText', false, text);
    });

    editor.addEventListener('input', () => {
      // innerText preserves \n for <br>; trim any trailing newline browsers append
      setVal((editor.innerText || '').replace(/\n$/, ''));
    });

    editor.addEventListener('keydown', e => {
      // Plain Enter commits; Shift+Enter inserts a line break
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); editor.blur(); }
      if (e.key === 'Escape') { setVal(origVal); _editActive = false; editor.remove(); rerender(); }
    });

    editor.addEventListener('blur', () => {
      _editActive = false;
      editor.remove();
      rerender();
    });
  }

  const fontColorAuto  = document.getElementById('b-fontcolor-auto');

  const _initDark = isColorDark(bState.theme.bg);
  fontColorInput.value = _initDark ? '#e2e8f0' : '#1a1816';
  fontColorHex.textContent = fontColorInput.value;

  fontColorInput.addEventListener('input', e => {

  function showFeedback(msg) {
    const el = document.getElementById('export-feedback');
    el.textContent = msg;
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.textContent = ''; }, 2200);
  }

  document.getElementById('b-copy-svg').addEventListener('click', () => {
    navigator.clipboard.writeText(currentSVG)
      .then(() => showFeedback('SVG copied to clipboard'))
      .catch(() => showFeedback('Copy failed — try Download SVG'));
  });

  document.getElementById('b-dl-svg').addEventListener('click', () => {
    const blob = new Blob([currentSVG], { type: 'image/svg+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'chart.svg';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  document.getElementById('b-dl-png').addEventListener('click', () => {
    const blob = new Blob([currentSVG], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      const m = currentSVG.match(/viewBox="0 0 \d+ (\d+)"/);
      const h = m ? parseInt(m[1]) : 300;
      const scale = 2;
      const canvas = document.createElement('canvas');
      canvas.width = 560 * scale;
      canvas.height = h * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = 'chart.png';
      a.click();
      URL.revokeObjectURL(url);
    };
    img.src = url;
  });

  document.getElementById('b-copy-embed').addEventListener('click', () => {
    const b64 = btoa(unescape(encodeURIComponent(currentSVG)));
    const snippet = `<img src="data:image/svg+xml;base64,${b64}" alt="Chart" style="max-width:100%">`;
    navigator.clipboard.writeText(snippet)
      .then(() => showFeedback('Embed snippet copied'))
      .catch(() => showFeedback('Copy failed'));
  });

     Data edit modal

  function parseCSV(text) {
    const lines = text.trim().split('\n').filter(l => l.trim());
    if (!lines.length) return [];
    const rows = lines.map(l => l.split(',').map(s => s.trim()));
    const hasHeader = isNaN(rows[0]?.[1]);
    const dataRows = hasHeader ? rows.slice(1) : rows;
    return dataRows
      .map(r => ({ l: r[0] || '', v: parseFloat(r[1]) }))
      .filter(r => r.l && !isNaN(r.v));
  }

  function dataToCSV(data) {
    return 'Label,Value\n' + data.map(r => `${r.l},${r.v}`).join('\n');
  }

  function dmAddRow(tbody, label, value) {
    const tr = document.createElement('tr');
    tr.innerHTML =
      `<td><input class="manual-cell" type="text" placeholder="Label" value="${escAttr(label || '')}"></td>` +
      `<td><input class="manual-cell" type="number" placeholder="0" value="${value !== undefined && value !== '' ? value : ''}"></td>` +
      `<td><button class="manual-del-btn" title="Remove">×</button></td>`;
    tr.querySelector('.manual-del-btn').addEventListener('click', () => { tr.remove(); dmSyncManual(); });
    tr.querySelectorAll('.manual-cell').forEach(inp => inp.addEventListener('input', dmSyncManual));
    tbody.appendChild(tr);
  }

  function dmSyncManual() {
    const rows = [];
    document.querySelectorAll('#dm-manual-tbody tr').forEach(tr => {
      const cells = tr.querySelectorAll('.manual-cell');
      const l = cells[0]?.value.trim();
      const v = parseFloat(cells[1]?.value);
      if (l && !isNaN(v)) rows.push({ l, v });
    });
    if (rows.length) dmApplyData(rows);
  }

  function dmApplyData(rows) {
    bState.data = rows;
    bState.options.barColors = bState.options.barColors.slice(0, rows.length);
    bState.options.selectedBar = -1;
    rerender();
    populateDataDisplay();
  }

  function setDmTab(name) {
    document.querySelectorAll('.dm-tab').forEach(t => t.classList.toggle('active', t.dataset.input === name));
    ['manual', 'paste', 'upload'].forEach(n => {
      document.getElementById('dm-input-' + n).hidden = n !== name;
    });
  }

  function openDataModal() {
    // Pre-populate Manual table
    const tbody = document.getElementById('dm-manual-tbody');
    tbody.innerHTML = '';
    if (bState.data.length) {
      bState.data.forEach(r => dmAddRow(tbody, r.l, r.v));
    } else {
      dmAddRow(tbody, '', '');
    }
    // Pre-populate Paste textarea
    document.getElementById('dm-csv-paste').value = bState.data.length ? dataToCSV(bState.data) : '';
    // Reset to Manual tab
    setDmTab('manual');
    // Clear upload filename
    document.getElementById('dm-upload-filename').hidden = true;
    document.getElementById('dm-upload-filename').textContent = '';
    document.getElementById('data-edit-modal').hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function closeDataModal() {
    document.getElementById('data-edit-modal').hidden = true;
    document.body.style.overflow = '';
  }

  // Tab switching
  document.querySelectorAll('.dm-tab').forEach(tab => {
    tab.addEventListener('click', () => setDmTab(tab.dataset.input));
  });

  // Paste CSV
  document.getElementById('dm-csv-paste').addEventListener('input', e => {
    const rows = parseCSV(e.target.value);
    if (rows.length) dmApplyData(rows);
  });

  // Manual table — add row
  document.getElementById('dm-add-row-btn').addEventListener('click', () => {
    dmAddRow(document.getElementById('dm-manual-tbody'), '', '');
  });

  // File upload
  const dmFileInput = document.getElementById('dm-file-input');
  const dmUploadLabel = document.getElementById('dm-upload-label');
  const dmUploadFilename = document.getElementById('dm-upload-filename');

  function dmReadFile(file) {
    if (!file) return;
    dmUploadFilename.textContent = file.name;
    dmUploadFilename.hidden = false;
    const reader = new FileReader();
    reader.onload = ev => {
      const rows = parseCSV(ev.target.result);
      if (rows.length) dmApplyData(rows);
    };
    reader.readAsText(file);
  }

  dmFileInput.addEventListener('change', e => dmReadFile(e.target.files[0]));
  dmUploadLabel.addEventListener('dragover', e => { e.preventDefault(); dmUploadLabel.classList.add('drag-over'); });
  dmUploadLabel.addEventListener('dragleave', () => dmUploadLabel.classList.remove('drag-over'));
  dmUploadLabel.addEventListener('drop', e => {
    e.preventDefault();
    dmUploadLabel.classList.remove('drag-over');
    dmReadFile(e.dataTransfer.files[0]);
  });

  // Done + Escape
  document.getElementById('dm-done-btn').addEventListener('click', closeDataModal);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !document.getElementById('data-edit-modal').hidden) closeDataModal();
  });

  </script>
</body>
</html>
