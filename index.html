<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>data-viz-lib — Find the right chart, fast</title>
  <meta name="description" content="A searchable library of data visualisations. Find the right chart type, preview it in your brand theme, and build it with your data." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600;700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Sidebar ───────────────────────────────────────────── -->
  <aside id="sidebar" class="sidebar sidebar--collapsed">
    <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="sidebar-inner">
      <div class="sidebar-section">
        <div class="sidebar-section-header">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.4"/><circle cx="7" cy="7" r="2" fill="currentColor"/></svg>
          <span>Theme</span>
        </div>

        <div class="theme-block">
          <label class="theme-label">Presets</label>
          <div class="preset-grid">
            <button class="preset-btn active" data-preset="default" title="Default">
              <span class="preset-swatch" style="background:#3B82F6"></span>
              <span>Default</span>
            </button>
            <button class="preset-btn" data-preset="bold" title="Bold">
              <span class="preset-swatch" style="background:#EF4444"></span>
              <span>Bold</span>
            </button>
            <button class="preset-btn" data-preset="earth" title="Earth">
              <span class="preset-swatch" style="background:#92400E"></span>
              <span>Earth</span>
            </button>
            <button class="preset-btn" data-preset="dark" title="Dark">
              <span class="preset-swatch" style="background:#1E293B"></span>
              <span>Dark</span>
            </button>
          </div>
        </div>

        <div class="theme-block">
          <label class="theme-label">Accent colour</label>
          <div class="color-row">
            <input type="color" id="color-accent" class="color-picker" value="#3B82F6" />
            <span class="color-hex" id="color-accent-hex">#3B82F6</span>
          </div>
        </div>

        <div class="theme-block">
          <label class="theme-label">Colour palette</label>
          <div id="palette-swatches" class="palette-swatches"></div>
          <button class="add-color-btn" id="add-palette-color">+ Add colour</button>
        </div>

        <div class="theme-block">
          <label class="theme-label">Background</label>
          <div class="color-row">
            <input type="color" id="color-bg" class="color-picker" value="#ffffff" />
            <span class="color-hex" id="color-bg-hex">#ffffff</span>
          </div>
        </div>

        <div class="theme-block">
          <label class="theme-label">Font</label>
          <select id="font-select" class="theme-select">
            <option value="Inter">Inter</option>
            <option value="'Georgia', serif">Georgia</option>
            <option value="'DM Sans', sans-serif">DM Sans</option>
            <option value="'Roboto', sans-serif">Roboto</option>
            <option value="monospace">Monospace</option>
          </select>
        </div>
      </div>

      <div class="sidebar-section sidebar-section--muted">
        <div class="sidebar-section-header">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="2" y="2" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M5 7h4M7 5v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span>Account</span>
          <span class="coming-soon-pill">Soon</span>
        </div>
        <p class="sidebar-coming-soon">Save themes, bookmark charts, and share collections.</p>
      </div>
    </div>
  </aside>

  <!-- ── Main ──────────────────────────────────────────────── -->
  <main id="main" class="main">

    <header class="site-header">
      <div class="header-wordmark">data-viz-lib</div>
      <p class="header-tagline">Find the right chart, fast. Preview it in your brand.</p>
    </header>

    <div class="search-wrap">
      <div class="search-bar">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
          <circle cx="7.5" cy="7.5" r="5.5" stroke="currentColor" stroke-width="1.6"/>
          <path d="M12 12l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <input
          id="search-input"
          type="text"
          placeholder="Try "show part of a whole" or "that chart with big circles"…"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="search-clear" class="search-clear" aria-label="Clear" hidden>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>

    <div class="filter-row" id="filter-row">
      <button class="filter-pill active" data-filter="all">All</button>
      <!-- populated by JS -->
    </div>

    <div class="results-meta" id="results-meta"></div>

    <div class="viz-grid" id="viz-grid">
      <!-- populated by JS -->
    </div>

  </main>

  <!-- ── Detail modal ──────────────────────────────────────── -->
  <div id="viz-modal" class="modal" aria-modal="true" role="dialog" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-panel">
      <div class="modal-header">
        <div>
          <h2 class="modal-title" id="modal-title"></h2>
          <div class="modal-tags" id="modal-tags"></div>
        </div>
        <button class="modal-close" id="modal-close" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 2l12 12M14 2L2 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="modal-tabs">
        <button class="modal-tab active" data-tab="explore">Explore</button>
        <button class="modal-tab" data-tab="build" disabled title="Coming soon">Build <span class="coming-soon-pill">Soon</span></button>
      </div>

      <div class="modal-tab-content" id="modal-tab-explore">
        <div class="modal-description" id="modal-description"></div>

        <div class="modal-chart-wrap">
          <div id="modal-chart"></div>
        </div>

        <div class="modal-meta-grid">
          <div class="modal-meta-block">
            <h4>When to use</h4>
            <ul id="modal-use-cases"></ul>
          </div>
          <div class="modal-meta-block">
            <h4>When not to use</h4>
            <ul id="modal-not-use"></ul>
          </div>
        </div>

        <div class="modal-also" id="modal-also"></div>
      </div>

      <div class="modal-tab-content" id="modal-tab-build" hidden>
        <p class="coming-soon-msg">Chart builder coming soon. You'll be able to paste in your data and export.</p>
      </div>
    </div>
  </div>

  <!-- ── Scripts ───────────────────────────────────────────── -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega@5/build/vega.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5/build/vega-lite.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6/build/vega-embed.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
